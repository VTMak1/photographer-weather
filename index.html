<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>光影天气 — 摄影师的天色指南</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        golden: '#F59E0B',
        'golden-light': '#FDE68A',
        'blue-hour': '#818cf8',
        'dawn-bg': '#0f172a',

}
</script>
<style>
  /* 天色感知系统 — 默认值（会被 body[data-sky] 覆盖） */
  body {
    --sky-top: #0f172a;
    --sky-bottom: #0f172a;
    --sky-glow: transparent;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(51, 65, 85, 0.5);
  }
  body[data-sky="golden"] {
    --sky-top: #1a1408;
    --sky-bottom: #0f172a;
    --sky-glow: rgba(245, 158, 11, 0.13);
    --card-bg: rgba(30, 25, 15, 0.88);
    --card-border: rgba(245, 158, 11, 0.13);
  }
  body[data-sky="blue"] {
    --sky-top: #080c1a;
    --sky-bottom: #0f172a;
    --sky-glow: rgba(129, 140, 248, 0.11);
    --card-bg: rgba(25, 25, 40, 0.88);
    --card-border: rgba(129, 140, 248, 0.13);
  }
  body[data-sky="clear"] {
    --sky-top: #0a141e;
    --sky-bottom: #0f172a;
    --sky-glow: rgba(56, 189, 248, 0.09);
    --card-bg: rgba(22, 28, 38, 0.88);
    --card-border: rgba(56, 189, 248, 0.11);
  }
  body[data-sky="overcast"] {
    --sky-top: #121216;
    --sky-bottom: #0f172a;
    --sky-glow: rgba(148, 163, 184, 0.06);
    --card-bg: rgba(28, 28, 33, 0.88);
    --card-border: rgba(148, 163, 184, 0.10);
  }
  body[data-sky="rain"] {
    --sky-top: #0a0f14;
    --sky-bottom: #0f172a;
    --sky-glow: rgba(100, 116, 139, 0.07);
    --card-bg: rgba(22, 26, 31, 0.88);
    --card-border: rgba(100, 116, 139, 0.11);
  }
  /* 保留旧变量兼容 */
  :root {
    --bg: #0f172a;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-golden: #F59E0B;
    --accent-blue: #818cf8;
    --accent-green: #34d399;
  }
  /* 天空画布 */
  #sky-canvas {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 45vh;
    pointer-events: none;
    z-index: 0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    transition: background 0.8s ease;
  }
  #sky-canvas::after {
    content: '';
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 75vw;
    height: 32vh;
    background: radial-gradient(ellipse at 50% 0%, var(--sky-glow) 0%, transparent 70%);
    transition: background 0.8s ease;
  }
  /* 仪表盘 Hero 数字 */
  .gauge-hero-score {
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.65) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px var(--sky-glow));
  }
  /* 光圈环 */
  .aperture-ring {
    width: 200px; height: 100px;
    border-radius: 200px 200px 0 0;
    margin: 0 auto;
    background: conic-gradient(
      from 180deg,
      #34d399 0deg,
      #F59E0B calc(var(--score-angle, 90deg) * 0.5),
      #334155 var(--score-angle, 90deg)
    );
    mask: radial-gradient(circle at 50% 100%, transparent 56%, black 58%);
    -webkit-mask: radial-gradient(circle at 50% 100%, transparent 56%, black 58%);
  }
  @media (min-width: 768px) {
    .aperture-ring { width:240px; height:120px; border-radius:240px 240px 0 0; }
    .gauge-hero-score { font-size:120px; }
  }
  /* 光圈叶片刻度 */
  .aperture-ring-inner {
    position: relative;
  }
  .aperture-tick {
    position: absolute;
    width: 1px; height: 6px;
    background: rgba(148,163,184,0.4);
    top: 0; left: 50%;
    transform-origin: bottom center;
  }
  /* 霞光动态光晕 — 强度由 JS 通过 CSS 变量控制 */
  @keyframes glowPulseDynamic {
    0%, 100% { box-shadow: var(--glow-lo, 0 0 2px rgba(245,158,11,0.05)); }
    50%      { box-shadow: var(--glow-hi, 0 0 6px rgba(245,158,11,0.15)); }
  }
  .glow-dynamic {
    animation: glowPulseDynamic 2.5s ease-in-out infinite;
    background: var(--glow-bg, transparent);
  }
  /* 分数弹性入场 */
  @keyframes scoreSpring {
    0%   { transform: scale(0.3); opacity: 0; }
    60%  { transform: scale(1.06); }
    80%  { transform: scale(0.96); }
    100% { transform: scale(1); opacity: 1; }
  }
  .gauge-hero-score {
    animation: scoreSpring 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  /* 光圈环弹性入场 */
  @keyframes ringReveal {
    0%   { opacity: 0; transform: scaleY(0.6); }
    100% { opacity: 1; transform: scaleY(1); }
  }
  .aperture-ring {
    animation: ringReveal 0.5s 0.15s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  .photographer-card {
    border-radius: 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.3);
    padding: 20px;
    position: relative;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.8s ease, border-color 0.8s ease;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    font-variant-numeric: tabular-nums;
  }
  /* 刷新按钮旋转 */
  @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin-icon { animation: spin360 0.45s ease-out; }
  /* 时间线红点脉冲 */
  @keyframes dotPulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.4); } }
  .timeline-dot { animation: dotPulse 2.2s ease-in-out infinite; transform-origin: center; }
  /* 温度刷新微弹 */
  @keyframes tempBreathe { 0%{ transform:scale(1); } 50%{ transform:scale(1.06); } 100%{ transform:scale(1); } }
  .temp-pop { animation: tempBreathe 0.5s cubic-bezier(0.34,1.56,0.64,1); display:inline-block; }
  /* 未来3日卡片按压微倾斜 */
  .future-day-item:active { transform: perspective(600px) rotateX(2deg) scale(0.96); transition: transform 0.1s ease; }
  body {
    font-variant-numeric: tabular-nums;
  }
  .photographer-card:active {
    transform: scale(0.98) translateZ(0);
    box-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }
  .card-accent-top { border-top: 3px solid transparent; }
  .card-accent-top.golden  { border-top-color: var(--accent-golden); }
  .card-accent-top.blue    { border-top-color: var(--accent-blue); }
  .card-accent-top.purple  { border-top-color: #a78bfa; }
  .card-accent-top.green   { border-top-color: var(--accent-green); }
  .skeleton {
    background: linear-gradient(90deg, rgba(30,41,59,0.6) 25%, rgba(51,65,85,0.5) 50%, rgba(30,41,59,0.6) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .glass {
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-bottom: 1px solid rgba(51, 65, 85, 0.25);
  }
  .card-enter {
    animation: cardSlideUp 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes cardSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pageFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  body {
    animation: pageFadeIn 0.5s ease-out;
  }
  /* 滚动渐入 */
  .reveal-on-scroll {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: opacity, transform;
  }
  .reveal-on-scroll.visible {
    opacity: 1;
    transform: translateY(0);
    will-change: auto;
  }
  /* 可折叠面板 */
  .collapsible-header {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    min-height: 44px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .collapsible-chevron {
    transition: transform 0.3s ease;
    font-size: 12px;
    color: var(--text-muted);
  }
  .collapsible-section.collapsed .collapsible-chevron {
    transform: rotate(-180deg);
  }
  .collapsible-body {
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.3s ease;
    max-height: 800px;
    opacity: 1;
  }
  .collapsible-section.collapsed .collapsible-body {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    margin-top: 0;
  }
  #city-sheet {
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
  }
  #city-sheet.open {
    transform: translateY(0);
  }
  #sheet-backdrop {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-out;
  }
  #sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .touch-target {
    min-height: 44px;
    min-width: 44px;
  }
  .gauge-ring {
    width: 180px; height: 90px;
    border-radius: 180px 180px 0 0;
    background: conic-gradient(from 180deg, #34d399 0deg, #F59E0B 90deg, #64748b 180deg);
    mask: radial-gradient(circle at 50% 100%, transparent 58%, black 60%);
    -webkit-mask: radial-gradient(circle at 50% 100%, transparent 58%, black 60%);
  }
  /* 衍生预警 */
  .derived-warning {
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.2);
  }
  /* 预警天际线光带 */
  #sky-canvas.warning-glow::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(180deg, rgba(239, 68, 68, 0.5) 0%, transparent 100%);
    z-index: 1;
    pointer-events: none;
    animation: warningPulse 2s ease-in-out infinite;
  }
  @keyframes warningPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }
</style>
</head>

<script>
// ===========================
// 配置 & 缓存模块
// ===========================
const CONFIG = {
  KEY: '66fc3cf8a3bb4a2f9688b2684fad995e',
  QWEATHER_BASE: 'https://n43aara9tt.re.qweatherapi.com/v7',
  CACHE_WEATHER_MS: 15 * 60 * 1000,
  CACHE_SUN_MS: 4 * 60 * 60 * 1000,
};

const Cache = {
  set(key, data) {
    const record = { ts: Date.now(), data };
    localStorage.setItem('pw_' + key, JSON.stringify(record));
  },
  get(key, maxAge) {
    const raw = localStorage.getItem('pw_' + key);
    if (!raw) return null;
    try {
      const record = JSON.parse(raw);
      if (maxAge !== Infinity && Date.now() - record.ts > maxAge) {
        localStorage.removeItem('pw_' + key);
        return null;
      }
      return record.data;
    } catch { return null; }
  },
  getTs(key) {
    const raw = localStorage.getItem('pw_' + key);
    if (!raw) return null;
    try { return JSON.parse(raw).ts; } catch { return null; }
  },
  remove(key) { localStorage.removeItem('pw_' + key); }
};

// ===========================
// Open-Meteo API — 免费无需Key · 三层云量 · 能见度 · 辐射
// ===========================
const OpenMeteo = {
  BASE: 'https://api.open-meteo.com/v1',
  GEO_BASE: 'https://geocoding-api.open-meteo.com/v1',

  async fetchJSON(url, timeoutMs = 6000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const resp = await fetch(url, { signal: ctrl.signal });
      if (!resp.ok) throw new Error(`OM HTTP ${resp.status}`);
      return resp.json();
    } finally {
      clearTimeout(timer);
    }
  },

  async geocode(cityName) {
    const ck = `om_geo_${cityName}`;
    const cached = Cache.get(ck, Infinity);
    if (cached) return cached;
    try {
      const u = `${this.GEO_BASE}/search?name=${encodeURIComponent(cityName)}&count=1&language=zh`;
      const d = await this.fetchJSON(u);
      if (d.results && d.results.length) {
        const r = d.results[0];
        const out = { lat: r.latitude, lon: r.longitude, name: r.name };
        Cache.set(ck, out, Infinity);
        return out;
      }
    } catch (e) { console.warn('OM geocode fail:', e.message); }
    return null;
  },

  async getHourlyData(lat, lon) {
    const ck = `om_h_${lat.toFixed(2)}_${lon.toFixed(2)}`;
    const cached = Cache.get(ck, CONFIG.CACHE_WEATHER_MS);
    if (cached) return cached;
    try {
      const p = `latitude=${lat}&longitude=${lon}&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,relative_humidity_2m,wind_speed_10m,surface_pressure,direct_radiation,diffuse_radiation,precipitation,temperature_2m,dew_point_2m&timezone=Asia/Shanghai&forecast_hours=24`;
      const d = await this.fetchJSON(`${this.BASE}/forecast?${p}`);
      Cache.set(ck, d, CONFIG.CACHE_WEATHER_MS);
      return d;
    } catch (e) { return null; }
  },

  extractHourly(data, targetHours) {
    if (!data || !data.hourly) return null;
    const h = data.hourly; const times = h.time || [];
    let lo=0, mi=0, hi=0, tot=0, vis=0, hum=0, wnd=0, prs=0, dir=0, dif=0, pcp=0, tmp=0, dew=0, n=0;
    for (let i = 0; i < times.length; i++) {
      if (!targetHours.includes(new Date(times[i]).getHours())) continue;
      lo  += (h.cloud_cover_low?.[i]    ?? 0);
      mi  += (h.cloud_cover_mid?.[i]    ?? 0);
      hi  += (h.cloud_cover_high?.[i]   ?? 0);
      tot += (h.cloud_cover?.[i]        ?? 0);
      vis += (h.visibility?.[i]         ?? 15000);
      hum += (h.relative_humidity_2m?.[i] ?? 60);
      wnd += (h.wind_speed_10m?.[i]     ?? 5);
      prs += (h.surface_pressure?.[i]   ?? 1013);
      dir += (h.direct_radiation?.[i]   ?? 0);
      dif += (h.diffuse_radiation?.[i]  ?? 0);
      pcp += (h.precipitation?.[i]      ?? 0);
      tmp += (h.temperature_2m?.[i]     ?? 15);
      dew += (h.dew_point_2m?.[i]       ?? 10);
      n++;
    }
    if (!n) return null;
    return {
      cloudLow: lo/n, cloudMid: mi/n, cloudHigh: hi/n, cloudTotal: tot/n,
      visibility: vis/n, humidity: hum/n, windSpeed: wnd/n, pressure: prs/n,
      directRad: dir/n, diffuseRad: dif/n, precip: pcp, temp: tmp/n, dewPoint: dew/n, count: n
    };
  }
};

// ===========================
// 气象公式模块 — 标准气象算法
// ===========================
const Meteo = {
  // Rothfusz 热指数 (US NWS) — 温度 ≥27°C & 湿度 ≥40% 时有效
  heatIndex(tempC, humidity) {
    if (tempC < 27 || humidity < 40) return tempC;
    const Tf = tempC * 9 / 5 + 32;  // °C → °F
    const R = humidity;
    let HI = -42.379 + 2.04901523 * Tf + 10.14333127 * R
           - 0.22475541 * Tf * R - 6.83783e-3 * Tf * Tf
           - 5.481717e-2 * R * R + 1.22874e-3 * Tf * Tf * R
           + 8.5282e-4 * Tf * R * R - 1.99e-6 * Tf * Tf * R * R;
    // 低湿调整
    if (R < 13 && Tf >= 80 && Tf <= 112) {
      HI -= ((13 - R) / 4) * Math.sqrt((17 - Math.abs(Tf - 95)) / 17);
    }
    // 高湿调整
    if (R > 85 && Tf >= 80 && Tf <= 87) {
      HI += ((R - 85) / 10) * ((87 - Tf) / 5);
    }
    return Math.round((HI - 32) * 5 / 9);  // °F → °C
  },

  // 加拿大 Humidex — 使用露点温度
  humidex(tempC, dewPointC) {
    if (tempC < 20 || dewPointC == null) return tempC;
    const Td = dewPointC + 273.16;  // 露点 → K
    const e = 6.11 * Math.exp(5417.7530 * (1 / 273.16 - 1 / Td));
    const H = tempC + 0.5555 * (e - 10);
    return Math.round(Math.max(tempC, H));
  },

  // 风寒指数 (JAG/TI) — 温度 ≤10°C & 风速 ≥4.8km/h 时有效
  windChill(tempC, windKmh) {
    if (tempC > 10 || windKmh < 4.8) return tempC;
    const V = Math.pow(windKmh / 1.852, 0.16);  // km/h → knots → V^0.16
    const WC = 13.12 + 0.6215 * tempC - 11.37 * Math.pow(windKmh, 0.16) + 0.3965 * tempC * Math.pow(windKmh, 0.16);
    return Math.round(WC);
  },

  // 露点差 → 雾/霾概率
  dewPointSpreadCategory(tempC, dewPointC) {
    if (dewPointC == null) return { spread: null, fogRisk: 'unknown', visFactor: 0 };
    const spread = tempC - dewPointC;
    if (spread <= 1.5) return { spread, fogRisk: 'high', visFactor: -5, desc: '露点接近气温，浓雾高风险' };
    if (spread <= 3)   return { spread, fogRisk: 'moderate', visFactor: -2, desc: '露点差小，薄雾可能' };
    if (spread <= 5)   return { spread, fogRisk: 'low', visFactor: 0, desc: '露点差适中' };
    if (spread >= 12)  return { spread, fogRisk: 'none', visFactor: +2, desc: '空气干燥，能见度极佳' };
    return { spread, fogRisk: 'none', visFactor: +1, desc: '露点差大，空气清澈' };
  },

  // 水汽压计算（Magnus 公式）
  vaporPressure(tempC, humidity) {
    const es = 6.112 * Math.exp(17.67 * tempC / (tempC + 243.5));  // 饱和水汽压 hPa
    return es * humidity / 100;  // 实际水汽压 hPa
  },

  // Steadman 体感温度（澳大利亚气象局通用公式）
  // AT = T + 0.348×e − 0.7×V − 4.25
  steadmanAT(tempC, humidity, windKmh) {
    const e = this.vaporPressure(tempC, humidity);    // 水汽压 hPa
    const V = windKmh / 3.6;                           // 风速 km/h → m/s
    const AT = tempC + 0.348 * e - 0.7 * V - 4.25;
    return Math.round(AT * 10) / 10;                   // 保留 1 位小数
  },

  // 体感综合：Steadman 为基础，极端情况用专项公式
  apparentTemp(tempC, humidity, windKmh, dewPointC) {
    if (tempC >= 27 && humidity >= 40) {
      return this.heatIndex(tempC, humidity);
    }
    if (tempC <= 10 && windKmh >= 4.8) {
      return this.windChill(tempC, windKmh);
    }
    if (tempC >= 20 && dewPointC != null && humidity >= 60) {
      return this.humidex(tempC, dewPointC);
    }
    return this.steadmanAT(tempC, humidity, windKmh);
  }
};

// ===========================
// 计算引擎
// ===========================
const CalcEngine = {
  getGoldenHour(sunrise, sunset) {
    const sr = new Date(sunrise);
    const ss = new Date(sunset);
    const morningEnd = new Date(sr.getTime() + 40 * 60000);
    const eveningStart = new Date(ss.getTime() - 40 * 60000);
    return {
      morning: { start: sunrise, end: morningEnd.toISOString() },
      evening: { start: eveningStart.toISOString(), end: sunset }
    };
  },

  getBlueHour(sunrise, sunset) {
    const sr = new Date(sunrise);
    const ss = new Date(sunset);
    const morningStart = new Date(sr.getTime() - 40 * 60000);
    const morningEnd   = new Date(sr.getTime() - 20 * 60000);
    const eveningStart = new Date(ss.getTime() + 20 * 60000);
    const eveningEnd   = new Date(ss.getTime() + 40 * 60000);
    return {
      morning: { start: morningStart.toISOString(), end: morningEnd.toISOString() },
      evening: { start: eveningStart.toISOString(), end: eveningEnd.toISOString() }
    };
  },

  getCountdown(sunrise, sunset) {
    const now = Date.now();
    const sr = new Date(sunrise).getTime();
    const ss = new Date(sunset).getTime();
    if (now < sr) return { target: '日出', ms: sr - now };
    if (now < ss) return { target: '日落', ms: ss - now };
    return { target: '明天日出', ms: sr + 86400000 - now };
  },

  getVisibilityRating(km) {
    if (km >= 15) return { level: '极佳', color: '#F59E0B', icon: 'star', desc: '远山天际线一览无余，风光长焦绝佳时机', pct: 100 };
    if (km >= 10) return { level: '良好', color: '#34d399', icon: 'check-circle', desc: '城市天际线清晰可见，适合各类风光拍摄', pct: 75 };
    if (km >= 5)  return { level: '一般', color: '#F59E0B', icon: 'minus-circle', desc: '远景略显朦胧，建议中近景构图', pct: 50 };
    if (km >= 1)  return { level: '较差', color: '#fb923c', icon: 'exclamation-circle', desc: '能见度偏低，适合氛围感/雾感创作', pct: 25 };
    return { level: '极差', color: '#ef4444', icon: 'times-circle', desc: '浓雾或严重污染，建议室内或微距拍摄', pct: 5 };
  },

  estimateVisibility(weatherNow, weather24h) {
    // 优先用 API 实测值
    const visRaw = parseFloat(weatherNow.vis);
    if (!isNaN(visRaw) && visRaw > 0 && visRaw < 25) return Math.round(visRaw);

    const text = (weatherNow.text || '').toLowerCase();
    const humidity = parseInt(weatherNow.humidity) || 50;
    const cloud = parseInt(weatherNow.cloud) || 50;
    const windSpeed = parseInt(weatherNow.windSpeed) || 0;
    const pressure = parseInt(weatherNow.pressure) || 1013;
    const temp = parseInt(weatherNow.temp) || 15;
    const dewRaw = parseFloat(weatherNow.dew);
    const dewPoint = !isNaN(dewRaw) ? dewRaw : null;

    // 基础能见度：天气文字判定
    let baseVis = 15;
    if (text.includes('雾') || text.includes('霾')) baseVis = 1;
    else if (text.includes('沙') || text.includes('尘') || text.includes('浮尘')) baseVis = 2;
    else if (text.includes('雨') || text.includes('阵雨')) baseVis = 6;
    else if (text.includes('毛毛雨') || text.includes(' drizzle')) baseVis = 4;
    else if (text.includes('阴')) baseVis = 8;
    else if (text.includes('雪')) baseVis = 3;
    else if (text.includes('多云')) baseVis = 14;
    else if (text.includes('晴')) baseVis = 18;

    // 露点差修正（雾的形成条件：气温接近露点）
    if (dewPoint !== null) {
      const spread = temp - dewPoint;
      if (spread <= 1.5)      baseVis -= 5;  // 露点差极小 → 浓雾高风险
      else if (spread <= 3)   baseVis -= 2;  // 露点差小 → 薄雾可能
      else if (spread <= 5)   baseVis += 0;  // 适中
      else if (spread >= 12)  baseVis += 2;  // 非常干燥 → 空气清澈
      else baseVis += 1;                     // 干燥 → 略好
    }

    // 湿度修正
    if (humidity > 90) baseVis -= 4;
    else if (humidity > 80) baseVis -= 3;
    else if (humidity > 70) baseVis -= 1;
    else if (humidity < 40) baseVis += 1;

    // 云量修正
    if (cloud > 90) baseVis -= 2;
    else if (cloud < 20) baseVis += 1;

    // 风速修正：大风能吹散雾霾
    if (windSpeed > 20) baseVis += 2;
    else if (windSpeed > 12) baseVis += 1;
    else if (windSpeed < 3) baseVis -= 1;

    // 气压修正
    if (pressure > 1020) baseVis += 1;
    else if (pressure < 1005) baseVis -= 1;

    return Math.max(0.3, Math.min(22, Math.round(baseVis)));
  },

  // 火烧云/霞光概率 — 10维模型，优先用 Open-Meteo 三层云量数据
  getGlowProbability(hourlyData, isSunrise, weatherNow, omData) {
    const targetHours = isSunrise ? [5, 6, 7, 8] : [16, 17, 18, 19];
    const month = new Date().getMonth() + 1;
    const text = (weatherNow?.text || '').toLowerCase();

    // 尝试从 Open-Meteo 提取分层云数据
    const om = omData ? OpenMeteo.extractHourly(omData, targetHours) : null;

    // ======= 1. 高云评分 (15%) — 卷云/卷层云最壮观 =======
    let highCloudScore = 50;
    if (om) {
      const hc = om.cloudHigh;
      if (hc >= 30 && hc <= 75 && om.cloudLow < 30) highCloudScore = 100;  // 高云多+低云少=完美
      else if (hc >= 20 && hc <= 85 && om.cloudLow < 40) highCloudScore = 80;
      else if (hc >= 10 && hc <= 90) highCloudScore = 55;
      else if (hc > 90) highCloudScore = 20;  // 满云，挡住
      else highCloudScore = 30;                // 高云太少，缺色彩载体
    } else {
      // 回退：用总云量估算
      const c = this._avgHourly(hourlyData, targetHours, 'cloud', weatherNow);
      highCloudScore = (c >= 20 && c <= 70) ? 75 : (c >= 10 && c <= 85) ? 50 : 20;
    }

    // ======= 2. 中云评分 (10%) — 高积云有橘红固态质感 =======
    let midCloudScore = 50;
    if (om) {
      const mc = om.cloudMid;
      if (mc >= 25 && mc <= 65 && om.cloudLow < 35) midCloudScore = 100;
      else if (mc >= 15 && mc <= 75) midCloudScore = 75;
      else if (mc > 80) midCloudScore = 20;
      else midCloudScore = 40;
    } else {
      midCloudScore = 50;
    }

    // ======= 3. 低云评分 (5%) — 低云<30%才能让夕阳照到云底 =======
    let lowCloudScore = 50;
    if (om) {
      const lc = om.cloudLow;
      if (lc < 20) lowCloudScore = 100;        // 低云极少，光照路径无遮挡
      else if (lc < 30) lowCloudScore = 85;
      else if (lc < 50) lowCloudScore = 55;
      else lowCloudScore = 15;                   // 低云厚，完全挡光
    }

    // ======= 4. 大气透明度/能见度 (15%) — 替代旧版估算 =======
    let visScore = 50;
    if (om && om.visibility) {
      const vkm = om.visibility / 1000;
      if (vkm >= 15) visScore = 100;
      else if (vkm >= 10) visScore = 85;
      else if (vkm >= 6) visScore = 65;
      else if (vkm >= 3) visScore = 40;
      else visScore = 15;
    } else {
      const vis = this.estimateVisibility(
        { text: weatherNow?.text, humidity: weatherNow?.humidity, cloud: weatherNow?.cloud, windSpeed: weatherNow?.windSpeed, pressure: weatherNow?.pressure }, null
      );
      visScore = Math.min(100, vis * 6);
    }

    // ======= 5. 雨后初晴 (12%) =======
    let precipScore = 50;
    const isPostRain = (text.includes('晴') || text.includes('多云')) && !text.includes('雨');
    if (isPostRain && om && om.precip < 0.5) precipScore = 100;
    else if (isPostRain && !om) precipScore = 85;
    else if (text.includes('雨')) precipScore = 10;
    else if (!text.includes('雨') && (om ? om.precip < 1 : true)) precipScore = 60;
    else precipScore = 30;

    // ======= 6. 湿度 (10%) =======
    const humidity = om ? om.humidity : this._avgHourly(hourlyData, targetHours, 'humidity', weatherNow);
    let humScore;
    if (humidity >= 35 && humidity <= 65) humScore = 100;
    else if (humidity >= 25 && humidity <= 80) humScore = 70;
    else if (humidity >= 15 && humidity <= 90) humScore = 40;
    else humScore = 15;

    // ======= 7. 风速 (8%) =======
    const wind = om ? om.windSpeed : this._avgHourly(hourlyData, targetHours, 'windSpeed', weatherNow);
    let windScore;
    if (wind >= 3 && wind <= 16) windScore = 100;
    else if (wind >= 1.5 && wind <= 22) windScore = 65;
    else if (wind < 1.5) windScore = 40;
    else windScore = 20;

    // ======= 8. 气压 (7%) =======
    const pressure = om ? om.pressure : (parseInt(weatherNow?.pressure) || 1013);
    let pressScore;
    if (pressure >= 1013 && pressure <= 1024) pressScore = 100;
    else if (pressure > 1024) pressScore = 65;
    else if (pressure >= 1005) pressScore = 55;
    else pressScore = 25;

    // ======= 9. 季节 (8%) =======
    let seasonScore;
    if (month >= 9 && month <= 11) seasonScore = 100;
    else if (month >= 3 && month <= 5) seasonScore = 85;
    else if (month === 12 || month <= 2) seasonScore = 60;
    else seasonScore = 50;

    // ======= 10. 辐射质量 (10%) — 直射/散射比，量化"光能不能打到云上" =======
    let radScore = 50;
    if (om && om.directRad > 0) {
      const ratio = om.directRad / Math.max(1, om.diffuseRad);
      if (ratio >= 2.5) radScore = 100;    // 直射光主导，夕阳能穿透
      else if (ratio >= 1.5) radScore = 85;
      else if (ratio >= 0.8) radScore = 65;
      else if (ratio >= 0.3) radScore = 40; // 散射为主，光线发白
      else radScore = 15;                    // 几乎无直射，云层太厚
    } else if (!om) {
      radScore = highCloudScore > 50 ? 70 : 50;  // 回退：云量推测
    }

    const total = highCloudScore * 0.15 + midCloudScore * 0.10 + lowCloudScore * 0.05
                + visScore * 0.15 + precipScore * 0.12 + humScore * 0.10
                + windScore * 0.08 + pressScore * 0.07 + seasonScore * 0.08
                + radScore * 0.10;

    return Math.min(95, Math.round(total));
  },

  // 辅助：从 QWeather 逐小时数据取平均值（无 Open-Meteo 时回退使用）
  _avgHourly(hourlyData, targetHours, field, weatherNow) {
    if (!hourlyData || !hourlyData.length) {
      const fallback = { cloud: 50, humidity: 50, windSpeed: 0 };
      return weatherNow ? (parseInt(weatherNow[field]) || fallback[field] || 50) : (fallback[field] || 50);
    }
    let sum = 0, n = 0;
    for (const h of hourlyData) {
      if (targetHours.includes(new Date(h.fxTime).getHours())) {
        const v = field === 'cloud' ? parseInt(h.cloud) : field === 'humidity' ? parseInt(h.humidity) : parseInt(h.windSpeed) || 0;
        sum += v || 0; n++;
      }
    }
    return n > 0 ? sum / n : (weatherNow ? (parseInt(weatherNow[field]) || 50) : 50);
  },

  getMoonInfo(moonData) {
    if (!moonData || !moonData.moonPhase) return null;
    const phases = moonData.moonPhase || [];
    if (!phases.length) return null;
    const p = phases[0];
    const illum = parseFloat(p.illumination) || 50;
    const icon = illum >= 90 ? '🌕' : illum >= 60 ? '🌔' : illum >= 30 ? '🌓' : illum >= 10 ? '🌒' : '🌑';
    const name = p.name || (illum >= 90 ? '满月' : illum >= 60 ? '盈凸月' : illum >= 30 ? '上/下弦月' : illum >= 5 ? '蛾眉月' : '新月');
    const starTip = illum < 20 ? '月暗星明，星轨银河最佳' : illum < 60 ? '月光适中，可兼顾地景' : '月光太亮，银河不理想';
    const moonrise = moonData.moonRise || p.moonrise || '';
    const moonset = moonData.moonSet || p.moonset || '';
    return { icon, name, illumination: Math.round(illum), moonrise, moonset, starTip };
  },

  // 综合摄影指数 (0-100) — 10维加权
  getPhotoIndex(ctx) {
    const scores = [
      { name: '霞光', weight: 0.20, score: Math.max(ctx.sunriseGlow, ctx.sunsetGlow) },
      { name: '能见度', weight: 0.18, score: Math.min(100, ctx.visibilityKm * 5) },
      { name: '高云', weight: 0.12, score: ctx.highCloud != null ? (ctx.highCloud >= 30 && ctx.highCloud <= 75 ? 100 : ctx.highCloud >= 15 && ctx.highCloud <= 85 ? 65 : 30) : 50 },
      { name: '中云', weight: 0.07, score: ctx.midCloud != null ? (ctx.midCloud >= 25 && ctx.midCloud <= 65 ? 100 : ctx.midCloud >= 15 && ctx.midCloud <= 75 ? 65 : 30) : 50 },
      { name: '低云', weight: 0.05, score: ctx.lowCloud != null ? (ctx.lowCloud < 20 ? 100 : ctx.lowCloud < 40 ? 65 : 25) : 50 },
      { name: '辐射', weight: 0.10, score: ctx.radScore != null ? ctx.radScore : 50 },
      { name: '湿度', weight: 0.08, score: ctx.humidity >= 40 && ctx.humidity <= 65 ? 100 : ctx.humidity >= 25 && ctx.humidity <= 80 ? 65 : 30 },
      { name: '风力', weight: 0.07, score: ctx.windSpeed >= 5 && ctx.windSpeed <= 15 ? 100 : ctx.windSpeed < 20 ? 65 : 30 },
      { name: '温度', weight: 0.07, score: ctx.temp >= 15 && ctx.temp <= 28 ? 100 : ctx.temp >= 5 && ctx.temp <= 35 ? 60 : 25 },
      { name: '月相', weight: 0.06, score: ctx.moonIllum ? (ctx.moonIllum < 20 ? 100 : ctx.moonIllum < 60 ? 65 : 30) : 50 },
    ];
    const total = Math.round(scores.reduce((sum, s) => sum + s.score * s.weight, 0));
    const label = total >= 75 ? '适宜拍摄' : total >= 50 ? '可以出门' : '不太理想';
    const color = total >= 75 ? '#34d399' : total >= 50 ? '#F59E0B' : '#94a3b8';
    let improvement = '';
    if (total >= 80) {
      improvement = '光影绝佳，出门爽拍！带上相机，今日必出大片';
    } else if (total >= 65) {
      improvement = '条件不错，值得出门，好光影不等人';
    } else if (total >= 50) {
      improvement = '还能拍，但别太期待。换个角度，平凡里也能出奇片';
    } else if (total >= 35) {
      improvement = '别生气，大自然的灯光总会再亮起';
    } else {
      improvement = '今日宜宅家修图，好天气值得等待';
    }
    return { total, label, color, scores, improvement };
  }
};

// ===========================
// 衍生预警 — 免费 API 无预警权限时，从天气描述推导
// ===========================
function deriveWarnings(weatherNow) {
  const warnings = [];
  const text = (weatherNow.text || '').toLowerCase();
  const temp = parseInt(weatherNow.temp) || 20;
  const windSpeed = parseInt(weatherNow.windSpeed) || 0;

  if (text.includes('暴雨') || text.includes('大暴雨') || text.includes('特大暴雨')) {
    warnings.push({ level: '红色', typeName: '暴雨', text: '当前有暴雨天气，请避免户外拍摄，注意器材防潮。远离河道、山坡等危险区域。' });
  } else if (text.includes('大雨') || text.includes('中雨') || text.includes('阵雨')) {
    warnings.push({ level: '黄色', typeName: '降雨', text: '当前有降雨天气，户外拍摄请注意器材防水，建议携带防雨罩。' });
  }
  if (text.includes('雷') || text.includes('暴')) {
    warnings.push({ level: '橙色', typeName: '雷暴', text: '当前有雷暴天气，请勿在空旷高处使用三脚架，立即暂停户外拍摄。' });
  }
  if (text.includes('台风') || text.includes('飓风')) {
    warnings.push({ level: '红色', typeName: '台风', text: '台风天气请待在室内，切勿外出拍摄。' });
  }
  if (temp >= 37) {
    warnings.push({ level: '橙色', typeName: '高温', text: '当前气温 ≥37°C，户外拍摄注意防暑降温，器材避免长时间暴晒。' });
  } else if (temp >= 35) {
    warnings.push({ level: '黄色', typeName: '高温', text: '当前气温 ≥35°C，户外拍摄请注意防暑，多备饮用水。' });
  }
  if (temp <= -10) {
    warnings.push({ level: '橙色', typeName: '严寒', text: '极寒天气，相机电池续航将大幅下降，请备足备用电池。' });
  }
  if (windSpeed >= 30) {
    warnings.push({ level: '橙色', typeName: '大风', text: `当前风速 ${windSpeed}km/h，三脚架可能不稳，建议使用配重或手持拍摄。` });
  } else if (windSpeed >= 20) {
    warnings.push({ level: '黄色', typeName: '大风', text: `当前风速 ${windSpeed}km/h，长曝光请确保三脚架稳固。` });
  }
  if (text.includes('霾') || text.includes('沙') || text.includes('尘')) {
    warnings.push({ level: '黄色', typeName: '低能见度', text: '当前有霾/沙尘，能见度低，远景拍摄效果差。建议尝试近景或氛围感创作，佩戴防护口罩。' });
  }
  if (text.includes('冰雹')) {
    warnings.push({ level: '红色', typeName: '冰雹', text: '冰雹天气请立即寻找遮蔽处，保护好摄影器材！' });
  }
  return warnings;
}

// ===========================
// 天色感知 — 根据天气和时段判断天空色调
// ===========================
function getSkyType(weatherNow, sunrise, sunset) {
  const icon = weatherNow ? (weatherNow.icon || '100') : '100';
  const now = Date.now();
  const sr = sunrise ? new Date(sunrise).getTime() : 0;
  const ss = sunset ? new Date(sunset).getTime() : 0;

  // 黄金时刻：日出后40min内 或 日落前40min内
  if ((sr && now > sr && now < sr + 40*60000) || (ss && now > ss - 40*60000 && now < ss)) {
    return 'golden';
  }
  // 蓝调时刻：日出前40min 或 日落后40min
  if ((sr && now > sr - 40*60000 && now < sr) || (ss && now > ss && now < ss + 40*60000)) {
    return 'blue';
  }

  const text = (weatherNow && weatherNow.text || '').toLowerCase();
  if (text.includes('雨')) return 'rain';
  if (text.includes('阴') || text.includes('多云')) return 'overcast';
  if (icon === '100' || icon === '101') return 'clear';
  return 'overcast';
}

// 时间感知霞光标签 — 根据当前时间判断"今"还是"明"
function getGlowLabels(sunData) {
  const now = Date.now();
  const sr = sunData?.sunrise ? new Date(sunData.sunrise).getTime() : 0;
  const ss = sunData?.sunset ? new Date(sunData.sunset).getTime() : 0;
  const sunsetLabel = (ss && now > ss) ? '明晚晚霞' : '今晚晚霞';
  const sunriseLabel = (sr && now > sr) ? '明晨朝霞' : '今晨朝霞';
  return { sunsetLabel, sunriseLabel };
}

    <div class="inline-flex px-5 py-1.5 rounded-full text-sm font-bold cursor-pointer hover:opacity-80 transition backdrop-blur-sm"

          <span class="text-slate-400 truncate">${s.name}</span>
          <span class="text-slate-200 font-bold">${Math.round(s.score)}</span>
          <div class="w-6 h-1 bg-slate-700 rounded-full overflow-hidden flex-shrink-0"><div class="h-full ${barC} rounded-full" style="width:${barW}%"></div></div>

function renderMetricsGrid(ctx, weatherNow, moonInfo, sunData) {
  const card = document.getElementById('card-metrics');
  card.className = 'photographer-card card-accent-top purple card-enter';
  const glowLabels = getGlowLabels(sunData);
  const ssLabel = ctx.sunsetGlow >= 70 ? '很可能烧' : ctx.sunsetGlow >= 50 ? '有希望' : ctx.sunsetGlow >= 30 ? '概率低' : '不太可能';
  const srLabel = ctx.sunriseGlow >= 70 ? '很可能烧' : ctx.sunriseGlow >= 50 ? '有希望' : ctx.sunriseGlow >= 30 ? '概率低' : '不太可能';
  const vis = CalcEngine.getVisibilityRating(ctx.visibilityKm);

  const dataSrc = ctx.omActive ? 'Open-Meteo 分层云量数据' : '和风天气基础数据（Open-Meteo 未响应）';
  // 光晕强度计算：概率25%起显，95%达满
  const glowIntensity = (p) => Math.max(0, Math.min(1, (p - 25) / 70));
  const glowStyle = (p) => {
    const t = glowIntensity(p);
    if (t <= 0) return '';
    const bg = `rgba(245,158,11,${(t * 0.2).toFixed(2)})`;
    const ring = `0 0 0 1px rgba(245,158,11,${(t * 0.35).toFixed(2)})`;
    const lo = `${ring}, 0 0 ${Math.round(2 + t * 10)}px rgba(245,158,11,${(0.05 + t * 0.15).toFixed(2)})`;
    const hi = `${ring}, 0 0 ${Math.round(8 + t * 22)}px rgba(245,158,11,${(0.15 + t * 0.40).toFixed(2)})`;
    return `--glow-bg:${bg};--glow-lo:${lo};--glow-hi:${hi};`;
  };
  const cellData = [
    { icon:'🔥', val:`${ctx.sunsetGlow}%`, label:glowLabels.sunsetLabel, sub:ssLabel, glow:ctx.sunsetGlow,
      tip:`10维度加权模型：高云(15%)、辐射质量(10%)、能见度(15%)、雨后初晴(12%)、湿度(10%)、风速(8%)、季节(8%)、气压(7%)、中云(10%)、低云(5%)。数据源：${dataSrc}。云量20-70%且有变化为佳，雨后初晴是最佳窗口。`,
      vCls: ctx.sunsetGlow >= 70 ? 'text-golden' : ctx.sunsetGlow >= 50 ? 'text-amber-400' : 'text-slate-400' },
    { icon:'🌅', val:`${ctx.sunriseGlow}%`, label:glowLabels.sunriseLabel, sub:srLabel, glow:ctx.sunriseGlow,
      tip:`朝霞湿度通常更高，颜色偏粉红；晚霞云层更活跃，颜色偏橙红。同一10维度模型独立计算，朝霞参考凌晨逐小时数据。数据源：${dataSrc}。`,
      vCls: ctx.sunriseGlow >= 70 ? 'text-golden' : ctx.sunriseGlow >= 50 ? 'text-amber-400' : 'text-slate-400' },
    { icon:'👁️', val:`${ctx.visibilityKm}`, unit:'km', label:'能见度', sub:vis.level,
      tip:`${vis.desc}。优先API实测值，无数据时由天气文字+露点差+湿度+云量+风速+气压交叉估算。`,
      vCls: ctx.visibilityKm >= 15 ? 'text-golden' : ctx.visibilityKm >= 10 ? 'text-emerald-400' : ctx.visibilityKm >= 5 ? 'text-amber-400' : 'text-slate-400' },
    { icon:moonInfo?moonInfo.icon:'🌓', val:`${moonInfo?moonInfo.illumination:'?'}`, unit:'%', label:moonInfo?moonInfo.name:'月相', sub:moonInfo?moonInfo.starTip:'',
      tip:'月照亮度<20%是银河/星轨最佳窗口；满月适合月光地景。月出月落时间决定拍摄窗口。',
      vCls:'text-slate-200' }
  ];

  card.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${cellData.map((c, i) => {
    const prob = c.glow; // 仅霞光格子有 glow 字段
    const dynamicStyle = prob != null ? glowStyle(prob) : '';
    const hasGlow = prob != null && glowIntensity(prob) > 0;
    const cellCls = hasGlow ? 'glow-dynamic' : 'bg-slate-800/40';
    const hi = prob != null && prob >= 70;
    return `
    <div class="text-center p-4 rounded-2xl cursor-pointer active:scale-95 transition-transform ${cellCls}" style="${dynamicStyle}" onclick="App.showToast('${c.tip.replace(/'/g,"\\'")}')">
      <div class="text-2xl mb-1">${c.icon}</div>
      <div class="text-2xl font-bold ${c.vCls}">${c.val}<span class="text-sm text-slate-500 font-normal ml-0.5">${c.unit||''}</span></div>
      <div class="text-xs text-slate-500 mt-0.5">${c.label}</div>
      <div class="text-xs font-medium mt-1 ${hi?'text-golden':'text-slate-400'}">${c.sub}</div>
    </div>
  `}).join('')}</div>`;
}

function renderLightTimeline(sunData) {
  const card = document.getElementById('card-light');
  const sunrise = sunData.sunrise, sunset = sunData.sunset;
  if (!sunrise || !sunset) {
    card.innerHTML = '<div class="text-center text-slate-500 py-8">日出日落数据暂不可用</div>';
    return;
  }
  const golden = CalcEngine.getGoldenHour(sunrise, sunset);
  const blue = CalcEngine.getBlueHour(sunrise, sunset);
  const countdown = CalcEngine.getCountdown(sunrise, sunset);
  const fmt = iso => { const d = new Date(iso); return d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}); };
  const h = Math.floor(countdown.ms / 3600000);
  const m = Math.floor((countdown.ms % 3600000) / 60000);

  const srTs = new Date(sunrise).getTime();
  const ssTs = new Date(sunset).getTime();
  const nowTs = Date.now();
  let posPct = 50;
  if (nowTs < srTs) posPct = 5;
  else if (nowTs > ssTs) posPct = 95;
  else posPct = 5 + 90 * (nowTs - srTs) / (ssTs - srTs);

  card.className = 'photographer-card card-accent-top blue card-enter collapsible-section';
  card.innerHTML = `
    <div class="collapsible-header mb-3">
      <div class="collapsible-trigger flex items-center gap-2 flex-1 min-w-0 cursor-pointer">

    <div class="collapsible-body">
    <div class="relative pt-2 pb-8 mb-4">
      <div class="flex justify-between text-xs text-slate-500 mb-2">

        <span>日落 ${fmt(sunset)}</span>

      <div class="p-3 bg-amber-900/20 rounded-xl"><div class="text-amber-400 font-medium">🌅 清晨黄金</div><div class="text-xs text-slate-500 mt-1">${fmt(golden.morning.start)} - ${fmt(golden.morning.end)}</div></div>
      <div class="p-3 bg-indigo-900/20 rounded-xl"><div class="text-indigo-400 font-medium">🌌 清晨蓝调</div><div class="text-xs text-slate-500 mt-1">${fmt(blue.morning.start)} - ${fmt(blue.morning.end)}</div></div>
      <div class="p-3 bg-amber-900/20 rounded-xl"><div class="text-amber-400 font-medium">🌇 傍晚黄金</div><div class="text-xs text-slate-500 mt-1">${fmt(golden.evening.start)} - ${fmt(golden.evening.end)}</div></div>
      <div class="p-3 bg-indigo-900/20 rounded-xl"><div class="text-indigo-400 font-medium">🌙 傍晚蓝调</div><div class="text-xs text-slate-500 mt-1">${fmt(blue.evening.start)} - ${fmt(blue.evening.end)}</div></div>
    </div>
    <div class="mt-4 pt-3 border-t border-slate-700/50 text-center">

function renderFutureDays(dailyData, weatherNow, moonInfo) {
  const card = document.getElementById('card-future');
  if (!dailyData || !dailyData.length) {
    card.innerHTML = '<div class="text-center text-slate-500 py-4">未来预报暂不可用</div>';
    return;
  }
  card.className = 'photographer-card card-accent-top purple card-enter collapsible-section';
  const dayLabels = ['今天', '明天', '后天'];
  const month = new Date().getMonth() + 1;
  const currMoonIllum = moonInfo ? moonInfo.illumination : 50;

  const scored = dailyData.slice(0, 3).map((d, i) => {
    const icon = d.iconDay || '100';
    const textDay = (d.textDay || '').toLowerCase();
    const vis = parseFloat(d.vis);
    const visibilityKm = (!isNaN(vis) && vis > 0 && vis < 50) ? Math.round(vis) : CalcEngine.estimateVisibility(
      { text: d.textDay, humidity: d.humidity, cloud: d.cloud, windSpeed: d.windSpeedDay, pressure: d.pressure }, null
    );
    const cloudCover = parseInt(d.cloud) || 50;
    const humidity = parseInt(d.humidity) || 50;
    const windSpeed = parseInt(d.windSpeedDay) || 0;
    const temp = parseInt(d.tempMax) || 20;
    const isPostRain = (textDay.includes('晴') || textDay.includes('多云')) && !textDay.includes('雨');
    const isAutumn = month >= 9 && month <= 11;
    const cloudScore = (cloudCover >= 20 && cloudCover <= 70) ? 90 : (cloudCover >= 10 && cloudCover <= 85) ? 55 : 20;
    const humScore = (humidity >= 35 && humidity <= 65) ? 90 : (humidity >= 25 && humidity <= 80) ? 65 : 30;
    const glowEst = Math.round(cloudScore * 0.4 + humScore * 0.25 + (isPostRain ? 25 : 0) + (isAutumn ? 10 : 0));
    const idx = CalcEngine.getPhotoIndex({ visibilityKm, sunriseGlow: glowEst, sunsetGlow: glowEst, cloudCover, humidity, windSpeed, temp, isAutumn, isPostRain, isMorning: true, moonIllum: currMoonIllum });
    return { day: dayLabels[i], icon, tempMax: d.tempMax, tempMin: d.tempMin, textDay: d.textDay || '', idx };
  });

  // 最佳拍摄日（同分全部高亮）
  const bestTotal = Math.max(...scored.map(s => s.idx.total));
  const bestIndices = scored.reduce((arr, s, i) => { if (s.idx.total === bestTotal) arr.push(i); return arr; }, []);

  card.innerHTML = `
    <div class="collapsible-header mb-3">
      <div class="collapsible-trigger flex items-center gap-2 flex-1 min-w-0 cursor-pointer">
        <i class="fa fa-calendar text-blue-hour text-xl flex-shrink-0"></i>
        <span class="font-bold text-slate-100 text-lg">未来 3 日 · 摄影预报</span>
        <i class="fa fa-chevron-up collapsible-chevron flex-shrink-0 ml-auto"></i>
      </div>
    </div>
    <div class="collapsible-body">
      <div class="grid grid-cols-3 gap-2">
        ${scored.map((s, i) => {
          const isBest = bestIndices.includes(i);
          const idx = s.idx;
          const scoreClr = idx.total >= 75 ? 'text-emerald-400' : idx.total >= 50 ? 'text-golden' : 'text-slate-400';
          const labelClr = idx.total >= 75 ? 'bg-emerald-400/20 text-emerald-400' : idx.total >= 50 ? 'bg-amber-400/20 text-golden' : 'bg-slate-700/30 text-slate-400';
          const label = idx.total >= 75 ? '适宜' : idx.total >= 50 ? '一般' : '不宜';
          // 最佳日金色高亮，否则今天用弱边框，其它天无边框
          const cardCls = isBest
            ? 'bg-golden/10 border-2 border-golden/50'
            : (i === 0 ? 'bg-slate-800/50 border border-slate-600/20' : 'bg-slate-800/30');
          const dayBadge = isBest
            ? '<span class="text-xs text-golden font-bold bg-golden/20 px-1.5 py-0.5 rounded-full ml-0.5 whitespace-nowrap">🏆 最佳</span>'
            : '';
          return `<div class="text-center p-3 rounded-2xl future-day-item ${cardCls}">
            <div class="text-xs text-slate-500 mb-1 whitespace-nowrap">${s.day}${dayBadge}</div>
            <div class="text-xl mb-1">${getWeatherEmoji(s.icon)}</div>
            <div class="font-bold text-slate-200 text-sm">${s.tempMax}°/${s.tempMin}°</div>
            <div class="text-xs text-slate-500 mt-0.5">${s.textDay}</div>
            <div class="text-2xl font-bold mt-1.5 ${scoreClr}">${idx.total}</div>
            <div class="text-xs font-medium mt-0.5 px-2 py-0.5 rounded-full inline-block ${labelClr}">${label}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="text-xs text-slate-600 text-center mt-3">* 基于3日预报数据推算，仅供参考</div>
    </div>
  `;
}

function renderWarningBanner(warnings) {
  const card = document.getElementById('card-warning');
  const sky = document.getElementById('sky-canvas');
  if (!warnings || !warnings.length) {
    card.classList.add('hidden');
    card.innerHTML = '';
    sky.classList.remove('warning-glow');
    return;
  }
  sky.classList.add('warning-glow');
  card.classList.remove('hidden');
  card.className = 'photographer-card card-enter';
  card.innerHTML = warnings.map(w => {
    const colorMap = { '黄色': 'border-yellow-600 bg-yellow-900/20', '橙色': 'border-orange-600 bg-orange-900/20', '红色': 'border-red-600 bg-red-900/20' };
    const iconMap = { '黄色': 'text-yellow-400', '橙色': 'text-orange-400', '红色': 'text-red-400' };
    const cls = colorMap[w.level] || 'border-yellow-600 bg-yellow-900/20';
    const iCls = iconMap[w.level] || 'text-yellow-400';
    const derivedNote = w._derived ? '<div class="text-xs text-slate-500 mt-1">（根据天气数据自动推定）</div>' : '';

}

}

      const icon = document.querySelector('#refresh-btn .fa-refresh');
      icon.classList.remove('spin-icon');
      void icon.offsetWidth; // 强制回流重触发动画
      icon.classList.add('spin-icon');
      this.refresh();
    });
    document.getElementById('share-btn').addEventListener('click', () => this.share());
    document.getElementById('btn-gps').addEventListener('click', () => this.useGPS());
    document.getElementById('city-search-input').addEventListener('input', e => this.handleSearch(e.target.value));
    document.getElementById('btn-gps').addEventListener('touchstart', function() { this.classList.add('bg-amber-900/60'); });
    document.getElementById('btn-gps').addEventListener('touchend', function() { this.classList.remove('bg-amber-900/60'); });
    document.getElementById('settings-btn').addEventListener('click', () => this.showSetupOverlay());
    this.initPullToRefresh();
    this.initCollapsibleSections();
    this.initScrollReveal();
  },

  initCollapsibleSections() {
    // 事件委托：点击折叠头部切换展开/折叠
    document.getElementById('main-content').addEventListener('click', (e) => {
      const trigger = e.target.closest('.collapsible-trigger');
      if (!trigger) return;
      const section = trigger.closest('.collapsible-section');
      if (!section) return;
      section.classList.toggle('collapsed');
    });
  },

  initScrollReveal() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -20px 0px' });
    document.querySelectorAll('.reveal-on-scroll').forEach(el => {
      observer.observe(el);
    });
    // 初始可见元素立即显示
    setTimeout(() => {
      document.querySelectorAll('.reveal-on-scroll').forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight) el.classList.add('visible');
      });
    }, 100);
  },

  share() {
    const city = this.currentCity?.name || '当前城市';
    const text = `📷 光影天气 — ${city}\n查看摄影指数、霞光概率、黄金时刻 → https://vtmak1.github.io/photographer-weather/`;
    if (navigator.share) {
      navigator.share({ title: '光影天气', text, url: 'https://vtmak1.github.io/photographer-weather/' }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text).then(() => this.showToast('链接已复制，分享给朋友吧')).catch(() => this.showToast('https://vtmak1.github.io/photographer-weather/'));
    }
  },

  _toastTimer: null,
  showToast(msg) {
    const el = document.getElementById('toast');
    el.firstElementChild.textContent = msg;
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(12px)';
    }, 2200);
  },

  showDetail(msg) {
    const overlay = document.getElementById('detail-overlay');
    const card = document.getElementById('detail-card');
    card.textContent = msg;
    overlay.classList.remove('pointer-events-none');
    overlay.classList.add('pointer-events-auto');
    // 强制回流后添加动画
    void overlay.offsetWidth;
    overlay.classList.remove('opacity-0');
    overlay.classList.add('opacity-100');
    card.classList.remove('scale-95');
    card.classList.add('scale-100');
    // 点击背景关闭
    document.getElementById('detail-backdrop').onclick = () => this.hideDetail();
  },

  hideDetail() {
    const overlay = document.getElementById('detail-overlay');
    const card = document.getElementById('detail-card');
    overlay.classList.remove('opacity-100');
    overlay.classList.add('opacity-0');
    card.classList.remove('scale-100');
    card.classList.add('scale-95');
    overlay.classList.add('pointer-events-none');
    overlay.classList.remove('pointer-events-auto');
  },

  initPullToRefresh() {
    const main = document.getElementById('main-content');
    const indicator = document.getElementById('pull-indicator');
    const sky = document.getElementById('sky-canvas');
    let startY = 0, pulling = false;
    main.addEventListener('touchstart', e => {
      if (window.scrollY > 5) return;
      startY = e.touches[0].clientY;
      pulling = true;
    }, { passive: true });
    main.addEventListener('touchmove', e => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 30) {
        indicator.style.opacity = '1';
        indicator.innerHTML = '<i class="fa fa-arrow-down"></i> 释放刷新';
      }
      // 天空随下拉变亮（云层散开效果）
      if (dy > 0 && dy < 200) {
        const brightness = 1 + dy / 200 * 0.3;
        sky.style.filter = `brightness(${brightness})`;
      }
    }, { passive: true });
    main.addEventListener('touchend', e => {
      if (!pulling) return;
      const dy = e.changedTouches[0].clientY - startY;
      sky.style.filter = '';
      if (dy > 60) {
        indicator.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 刷新中…';
        this.refresh().then(() => {
          indicator.innerHTML = '<i class="fa fa-check"></i> 已刷新';
          setTimeout(() => { indicator.style.opacity = '0'; }, 1000);
        });
      } else {
        indicator.style.opacity = '0';
      }
      pulling = false;
    });
  },

  async loadCity(city) {
    this.currentCity = city;
    Cache.set('last_city', city, Infinity);
    document.getElementById('city-name').textContent = city.name;
    await this.fetchAllData(city.id);
    this.closeCitySheet();
    this.renderFavorites();
  },

  async fetchAllData(locationId) {
    // 城市切换过渡：天空短暂模糊+变亮
    const sky = document.getElementById('sky-canvas');
    sky.style.transition = 'filter 0.4s ease';
    sky.style.filter = 'blur(4px) brightness(1.15)';
    setTimeout(() => { sky.style.filter = 'blur(0px) brightness(1)'; }, 500);

    showSkeletons();
    this.hideStaleBanner();
    const results = { weatherNow: null, weather24h: null, sunData: null, airNow: null, moonData: null, dailyData: null, warnings: null, omData: null };
    const errors = [];
    const cityName = this.currentCity?.name || '';
    const tasks = [
      API.getWeatherNow(locationId).then(d => results.weatherNow = d).catch(e => errors.push('天气:'+e.message)),
      API.getWeather24h(locationId).then(d => results.weather24h = d).catch(e => errors.push('逐小时:'+e.message)),
      API.getSunTimes(locationId).then(d => results.sunData = d).catch(e => errors.push('日出日落:'+e.message)),
      API.getAirNow(locationId).then(d => results.airNow = d).catch(e => {}),
      API.getMoonPhase(locationId).then(d => results.moonData = d).catch(e => {}),
      API.getWeather3d(locationId).then(d => results.dailyData = d).catch(e => {}),
      API.getWarning(locationId).then(d => results.warnings = d).catch(e => {}),
      // Open-Meteo：GPS 定位直接使用经纬度，搜索城市则先地理编码（静默失败不影响主流程）
      (async () => {
        const city = this.currentCity;
        if (!city) return;
        // GPS 定位已有精确坐标，直接请求，跳过地理编码
        if (city.lat != null && city.lon != null) {
          results.omData = await OpenMeteo.getHourlyData(city.lat, city.lon);
        } else if (city.name) {
          const geo = await OpenMeteo.geocode(city.name);
          if (geo) results.omData = await OpenMeteo.getHourlyData(geo.lat, geo.lon);
        }
      })().catch(() => {}),
    ];
    await Promise.allSettled(tasks);
    if (!results.weatherNow) {
      if (this.currentData) {
        this.updateUI(this.currentData);
        this.showStaleBanner();
      } else {
        this.clearSkeletonsWithHint('数据加载失败：' + (errors.join('; ') || '网络异常'));
        if (errors.length) this.showError(errors[0]);
      }
      return;
    }
    this.currentData = results;
    this.updateUI(results);
    if (errors.length) this.showError('部分数据加载失败：' + errors.join('; '));
  },

  updateUI(data) {
    const { weatherNow, weather24h, sunData, airNow, moonData, dailyData, warnings, omData } = data;
    _hourlyData = weather24h || [];

    // 能见度优先用 Open-Meteo 实测值
    const omSunset = omData ? OpenMeteo.extractHourly(omData, [16,17,18,19]) : null;
    const omSunrise = omData ? OpenMeteo.extractHourly(omData, [5,6,7,8]) : null;
    const omVis = omSunset || omSunrise;
    const visibilityKm = omVis ? Math.round(omVis.visibility / 1000) : CalcEngine.estimateVisibility(weatherNow, weather24h);

    const hourlyData = weather24h || [];
    const sunriseProb = CalcEngine.getGlowProbability(hourlyData, true, weatherNow, omData);
    const sunsetProb = CalcEngine.getGlowProbability(hourlyData, false, weatherNow, omData);
    const moonInfo = CalcEngine.getMoonInfo(moonData);

    const ctx = this.buildContext(weatherNow, weather24h, visibilityKm, sunriseProb, sunsetProb, sunData, moonInfo, omData);
    const photoIndex = CalcEngine.getPhotoIndex(ctx);
    const recs = RecommendEngine.getRecommendations(ctx);

    const glowLabels = getGlowLabels(sunData);
    const summaryParts = [];
    if (sunsetProb >= 65) summaryParts.push(glowLabels.sunsetLabel + '概率高');
    if (sunriseProb >= 65) summaryParts.push(glowLabels.sunriseLabel + '概率高');
    if (visibilityKm >= 10) summaryParts.push('能见度佳');
    if (ctx.windSpeed < 15 && ctx.windSpeed > 3) summaryParts.push('风力适宜');
    if (ctx.isStorm) summaryParts.push('📡 注意天气变化');
    if (!summaryParts.length) summaryParts.push('条件一般，可选择性出行');

    // 合并 API 预警与衍生预警
    const apiWarnings = Array.isArray(warnings) ? warnings : [];
    const derivedWarnings = deriveWarnings(weatherNow);
    // 衍生预警不与 API 预警重复
    const allWarnings = [...apiWarnings];
    for (const dw of derivedWarnings) {
      if (!apiWarnings.some(w => (w.typeName || '') === dw.typeName)) {
        dw._derived = true;
        allWarnings.push(dw);
      }
    }

    renderWeatherHero(weatherNow, ctx);
    renderPhotoGauge(photoIndex, sunData, ctx.omActive);
    renderMetricsGrid(ctx, weatherNow, moonInfo, sunData);
    renderRecommendCard(recs);
    renderLightTimeline(sunData || {});
    renderFutureDays(dailyData, weatherNow, moonInfo);
    renderWarningBanner(allWarnings);

    document.getElementById('weather-update-time').textContent =
      `📍 ${this.currentCity.name} · 更新于 ${new Date().toLocaleTimeString('zh-CN')}`;
    document.getElementById('gauge-summary').textContent = summaryParts.join(' · ');
    if (summaryParts.includes('注意天气变化')) document.getElementById('gauge-summary').className = 'text-sm text-amber-400';

    // 设置天色主题
    const skyType = getSkyType(weatherNow, sunData?.sunrise, sunData?.sunset);
    document.body.setAttribute('data-sky', skyType);

    // 卡片依次入场
    this.staggerCards();
  },

  staggerCards() {
    const cards = document.querySelectorAll('.card-enter');
    cards.forEach((card, i) => {
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = `cardEnter 0.4s ${i * 0.06}s cubic-bezier(0.16,1,0.3,1) both`;
    });
  },

  buildContext(weatherNow, weather24h, visibilityKm, sunriseProb, sunsetProb, sunData, moonInfo, omData) {
    const icon = weatherNow.icon || '100';
    const now = new Date();
    const hour = now.getHours();
    const month = now.getMonth() + 1;
    const text = (weatherNow.text || '').toLowerCase();
    const precip = parseFloat(weatherNow.precip) || 0;
    const temp = parseInt(weatherNow.temp) || 15;
    const dewRaw = parseFloat(weatherNow.dew);
    const dewPoint = !isNaN(dewRaw) ? dewRaw : null;

    const isPostRain = (text.includes('晴') || text.includes('多云')) && precip === 0 && !text.includes('雨');
    const isStorm = text.includes('雷') || text.includes('暴');
    const isCold = temp < 0;
    const isAutumn = month >= 9 && month <= 11;

    let tempDiff = 8;
    if (weather24h && weather24h.length > 0) {
      const temps = weather24h.map(h => parseInt(h.temp) || 0).filter(t => t !== 0);
      if (temps.length >= 2) tempDiff = Math.max(...temps) - Math.min(...temps);
    }

    // 从 Open-Meteo 提取云层和辐射数据
    const targetH = isAutumn ? [16,17,18] : [17,18,19]; // 日落附近
    const omSunset = omData ? OpenMeteo.extractHourly(omData, targetH) : null;
    let highCloud = null, midCloud = null, lowCloud = null, radScore = null;
    let omActive = false;

    if (omSunset) {
      omActive = true;
      highCloud = Math.round(omSunset.cloudHigh);
      midCloud = Math.round(omSunset.cloudMid);
      lowCloud = Math.round(omSunset.cloudLow);
      if (omSunset.directRad > 0) {
        const ratio = omSunset.directRad / Math.max(1, omSunset.diffuseRad);
        radScore = ratio >= 2.5 ? 100 : ratio >= 1.5 ? 85 : ratio >= 0.8 ? 65 : ratio >= 0.3 ? 40 : 15;
      }
    }

    return {
      sunsetGlow: sunsetProb,
      sunriseGlow: sunriseProb,
      visibilityScore: Math.min(100, visibilityKm * 5),
      visibilityKm,
      isClear: icon === '100' || icon === '101',
      isOvercast: icon === '104',
      cloudCover: parseInt(weatherNow.cloud) || 50,
      windSpeed: parseInt(weatherNow.windSpeed) || 0,
      humidity: parseInt(weatherNow.humidity) || 50,
      isMorning: hour >= 5 && hour <= 9,
      isGoldenHour: false,
      rainRecent: text.includes('雨'),
      isPostRain,
      isStorm,
      isCold,
      isAutumn,
      tempDiff,
      temp,
      dewPoint,
      moonIllum: moonInfo ? moonInfo.illumination : 50,
      weatherText: weatherNow.text || '',
      highCloud, midCloud, lowCloud, radScore,
      omActive
    };
  },

  async handleSearch(query) {
    clearTimeout(this.searchTimer);
    if (query.length < 1) {
      document.getElementById('search-results').classList.add('hidden');
      return;
    }
    const q = query.trim();
    const matches = App._getCities().filter(c =>
      c.name.includes(q) || c.prov.includes(q)
    ).slice(0, 20);
    if (matches.length > 0) {
      this.renderSearchResults(matches.map(c => ({ id: c.id, name: c.name, adm1: c.prov })));
    } else {
      document.getElementById('search-results').classList.remove('hidden');
      document.getElementById('search-results-list').innerHTML =
        '<div class="text-slate-500 text-sm p-3">未找到匹配城市，请尝试其他关键词</div>';
    }
  },

  renderSearchResults(cities) {
    const section = document.getElementById('search-results');
    const list = document.getElementById('search-results-list');
    if (!cities.length) {
      list.innerHTML = '<div class="text-slate-500 text-sm p-3">未找到匹配城市</div>';
    } else {
      list.innerHTML = cities.map(c => `
        <div class="flex items-center gap-3 p-3 hover:bg-slate-700/50 rounded-xl cursor-pointer touch-target group">
          <div class="flex-1 flex items-center gap-3" onclick="App.loadCity({id:'${c.id}',name:'${c.name}',adm1:'${c.adm1||''}'})">
            <i class="fa fa-map-marker text-slate-500"></i>
            <span class="font-medium text-slate-200">${c.name}</span>
            <span class="text-xs text-slate-500">${c.adm1||''}</span>
          </div>
          <button class="text-slate-600 hover:text-golden p-1.5 touch-target transition-colors" onclick="event.stopPropagation();Geo.addFavoriteCity({id:'${c.id}',name:'${c.name}',adm1:'${c.adm1||''}'});App.renderFavorites();App.showToast('已收藏 ${c.name}')" title="收藏">
            <i class="fa fa-star-o"></i>
          </button>
        </div>
      `).join('');
    }
    section.classList.remove('hidden');
  },

  renderFavorites() {
    const cities = Geo.getFavoriteCities();
    const list = document.getElementById('favorites-list');
    const section = document.getElementById('favorites-section');
    if (!cities.length) {
      section.classList.add('hidden');
      return;
    }
    section.classList.remove('hidden');
    list.innerHTML = cities.map(c => `
      <div class="flex items-center gap-3 p-3 hover:bg-slate-700/50 rounded-xl cursor-pointer touch-target"
           onclick="App.loadCity({id:'${c.id}',name:'${c.name}',adm1:'${c.adm1||''}'})">
        <i class="fa fa-map-marker text-golden"></i>
        <span class="flex-1 font-medium text-slate-200">${c.name}</span>
        <span class="text-xs text-slate-500 mr-2">${c.adm1||''}</span>
        <button class="text-slate-600 hover:text-red-400 p-1 touch-target" onclick="event.stopPropagation();Geo.removeFavoriteCity('${c.id}')">
          <i class="fa fa-times"></i>
        </button>
      </div>
    `).join('');
  },

  openCitySheet() {
    document.getElementById('city-sheet').classList.add('open');
    document.getElementById('sheet-backdrop').classList.add('open');
    document.getElementById('city-search-input').value = '';
    document.getElementById('search-results').classList.add('hidden');
    this.renderFavorites();
  },

  closeCitySheet() {
    document.getElementById('city-sheet').classList.remove('open');
    document.getElementById('sheet-backdrop').classList.remove('open');
  },

  async useGPS() {
    const status = document.getElementById('gps-status');
    status.textContent = '定位中…';
    try {
      const pos = await Geo.getCurrentPosition();
      const city = await Geo.getCityByCoords(pos.lat, pos.lon);
      status.textContent = '';
      await this.loadCity(city);
    } catch (err) {
      status.textContent = '定位失败，请手动搜索';
      this.clearSkeletonsWithHint('无法自动定位，请点击上方城市栏搜索');
      setTimeout(() => { status.textContent = ''; }, 5000);
    }
  },

  clearSkeletonsWithHint(hint) {
    const card = document.getElementById('card-weather');
    card.innerHTML = `<div class="text-center py-12 text-slate-500"><i class="fa fa-map-marker text-4xl mb-3 block"></i><p class="text-sm">${hint}</p><button class="mt-3 bg-golden text-slate-900 px-5 py-2 rounded-full text-sm font-bold" onclick="App.openCitySheet()">手动选择城市</button></div>`;
    ['card-gauge','card-metrics','card-recommend','card-light','card-future'].forEach(id => {
      document.getElementById(id).innerHTML = '';
    });
  },

  async refresh() {
    if (this.currentCity) {
      const btn = document.getElementById('refresh-btn');
      btn.style.transform = 'rotate(360deg)';
      btn.style.transition = 'transform 0.6s ease';
      setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 600);
      await this.fetchAllData(this.currentCity.id);
    }
  },

  showStaleBanner() {
    const banner = document.getElementById('stale-banner');
    banner.classList.remove('hidden');
    banner.innerHTML = '<i class="fa fa-exclamation-triangle"></i> 无法连接网络，显示的是缓存数据';
    setTimeout(() => this.hideStaleBanner(), 5000);
  },

  hideStaleBanner() {
    document.getElementById('stale-banner').classList.add('hidden');
  },

  showError(msg) {
    const banner = document.getElementById('stale-banner');
    banner.classList.remove('hidden');
    banner.className = 'fixed top-0 inset-x-0 z-50 bg-red-900/80 text-red-200 text-xs text-center py-1.5';
    banner.innerHTML = `<i class="fa fa-exclamation-circle"></i> ${msg}`;
    setTimeout(() => { banner.classList.add('hidden'); banner.className = 'hidden fixed top-0 inset-x-0 z-50 bg-yellow-900/80 text-yellow-200 text-xs text-center py-1.5'; }, 4000);
  },

};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
