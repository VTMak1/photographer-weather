<style>
  .photographer-card {
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    position: relative;
    overflow: hidden;
    background: white;
    border-left: 4px solid transparent;
  }
  .card-golden  { border-left-color: #F59E0B; }
  .card-blue    { border-left-color: #6366F1; }
  .card-purple  { border-left-color: #8B5CF6; }
  .card-green   { border-left-color: #10B981; }
  .skeleton {
    background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .glass {
    background: rgba(255, 251, 235, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .card-enter {
    animation: cardSlideUp 0.4s ease-out both;
  }
  @keyframes cardSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .sheet-enter {
    animation: sheetSlideUp 0.3s ease-out;
  }
  @keyframes sheetSlideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  #city-sheet {
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
  }
  #city-sheet.open {
    transform: translateY(0);
  }
  #sheet-backdrop {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-out;
  }
  #sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .touch-target {

<script>
// ===========================
// 配置 & 缓存模块
// ===========================
const CONFIG = {
  KEY: '66fc3cf8a3bb4a2f9688b2684fad995e',
  QWEATHER_BASE: 'https://n43aara9tt.re.qweatherapi.com/v7',
  CACHE_WEATHER_MS: 15 * 60 * 1000,
  CACHE_SUN_MS: 4 * 60 * 60 * 1000,
};

const Cache = {
  set(key, data) {
    const record = { ts: Date.now(), data };
    localStorage.setItem('pw_' + key, JSON.stringify(record));
  },
  get(key, maxAge) {
    const raw = localStorage.getItem('pw_' + key);
    if (!raw) return null;
    try {
      const record = JSON.parse(raw);
      if (maxAge !== Infinity && Date.now() - record.ts > maxAge) {
        localStorage.removeItem('pw_' + key);
        return null;
      }
      return record.data;
    } catch { return null; }
  },
  getTs(key) {
    const raw = localStorage.getItem('pw_' + key);
    if (!raw) return null;
    try { return JSON.parse(raw).ts; } catch { return null; }
  },
  remove(key) { localStorage.removeItem('pw_' + key); }
};

// ===========================
// API 模块
// ===========================
const API = {
  async fetchJSON(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  },

  async getWeatherNow(locationId) {
    const cacheKey = `weather_${locationId}`;
    const cached = Cache.get(cacheKey, CONFIG.CACHE_WEATHER_MS);
    if (cached) return cached;
    try {
      const url = `${CONFIG.QWEATHER_BASE}/weather/now?location=${locationId}&key=${CONFIG.KEY}`;
      const data = await this.fetchJSON(url);
      if (data.code !== '200') throw new Error('天气数据获取失败: ' + (data.code || ''));
      Cache.set(cacheKey, data.now);
      return data.now;
    } catch (e) {
      const stale = Cache.get(cacheKey, Infinity);
      if (stale) return stale;
      throw e;
    }
  },

  async getWeather24h(locationId) {
    const cacheKey = `weather24h_${locationId}`;
    const cached = Cache.get(cacheKey, CONFIG.CACHE_WEATHER_MS);
    if (cached) return cached;
    try {
      const url = `${CONFIG.QWEATHER_BASE}/weather/24h?location=${locationId}&key=${CONFIG.KEY}`;
      const data = await this.fetchJSON(url);
      if (data.code !== '200') throw new Error('逐小时数据获取失败');
      Cache.set(cacheKey, data.hourly);
      return data.hourly;
    } catch (e) {
      const stale = Cache.get(cacheKey, Infinity);
      if (stale) return stale;
      throw e;
    }
  },

  async getSunTimes(locationId, date) {
    // QWeather 要求 yyyyMMdd 格式
    const d = date ? new Date(date) : new Date();
    const dateStr = date ? date : d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const cacheKey = `sun_${locationId}_${dateStr}`;
    const cached = Cache.get(cacheKey, CONFIG.CACHE_SUN_MS);
    if (cached) return cached;
    try {
      const url = `${CONFIG.QWEATHER_BASE}/astronomy/sun?location=${locationId}&date=${dateStr}&key=${CONFIG.KEY}`;
      const data = await this.fetchJSON(url);
      if (data.code !== '200') throw new Error('日出日落数据获取失败');
      Cache.set(cacheKey, data);
      return data;
    } catch (e) {
      const stale = Cache.get(cacheKey, Infinity);
      if (stale) return stale;
      throw e;
    }
  },

  async getAirNow(locationId) {
    const cacheKey = `air_${locationId}`;
    const cached = Cache.get(cacheKey, CONFIG.CACHE_WEATHER_MS);
    if (cached) return cached;
    try {
      const url = `${CONFIG.QWEATHER_BASE}/air/now?location=${locationId}&key=${CONFIG.KEY}`;
      const data = await this.fetchJSON(url);
      if (data.code !== '200') throw new Error('空气质量数据获取失败');
      Cache.set(cacheKey, data.now);
      return data.now;
    } catch (e) {
      const stale = Cache.get(cacheKey, Infinity);
      if (stale) return stale;
      return null;
    }
  },

};

// ===========================
// 地理位置 & 城市管理
// ===========================
const Geo = {
  async getCurrentPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('浏览器不支持定位')); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        err => {
          const msgs = { 1: '请允许定位权限', 2: '无法获取位置信息', 3: '定位超时' };
          reject(new Error(msgs[err.code] || '定位失败'));
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    });
  },

  async getCityByCoords(lat, lon) {
    // QWeather 直接接受坐标作为 location 参数
    const location = `${lon.toFixed(2)},${lat.toFixed(2)}`;
    return { id: location, name: '当前位置', lat, lon };
  },

  getFavoriteCities() {
    try { return JSON.parse(localStorage.getItem('pw_favorites') || '[]'); }
    catch { return []; }
  },

  addFavoriteCity(city) {
    const cities = this.getFavoriteCities().filter(c => c.id !== city.id);
    cities.unshift({ id: city.id, name: city.name, adm1: city.adm1 || '' });
    if (cities.length > 10) cities.pop();
    localStorage.setItem('pw_favorites', JSON.stringify(cities));
  },

  removeFavoriteCity(cityId) {
    const cities = this.getFavoriteCities().filter(c => c.id !== cityId);
    localStorage.setItem('pw_favorites', JSON.stringify(cities));
    App.renderFavorites();
  }
};

// ===========================
// 计算引擎
// ===========================
const CalcEngine = {
  getGoldenHour(sunrise, sunset) {
    const sr = new Date(sunrise);
    const ss = new Date(sunset);
    const morningEnd = new Date(sr.getTime() + 40 * 60000);
    const eveningStart = new Date(ss.getTime() - 40 * 60000);
    return {
      morning: { start: sunrise, end: morningEnd.toISOString() },
      evening: { start: eveningStart.toISOString(), end: sunset }
    };
  },

  getBlueHour(sunrise, sunset) {
    const sr = new Date(sunrise);
    const ss = new Date(sunset);
    const morningStart = new Date(sr.getTime() - 40 * 60000);
    const morningEnd   = new Date(sr.getTime() - 20 * 60000);
    const eveningStart = new Date(ss.getTime() + 20 * 60000);
    const eveningEnd   = new Date(ss.getTime() + 40 * 60000);
    return {
      morning: { start: morningStart.toISOString(), end: morningEnd.toISOString() },
      evening: { start: eveningStart.toISOString(), end: eveningEnd.toISOString() }
    };
  },

  getCountdown(sunrise, sunset) {
    const now = Date.now();
    const sr = new Date(sunrise).getTime();
    const ss = new Date(sunset).getTime();
    if (now < sr) return { target: '日出', ms: sr - now };
    if (now < ss) return { target: '日落', ms: ss - now };
    return { target: '明天日出', ms: sr + 86400000 - now };
  },

  getVisibilityRating(km) {
    if (km >= 15) return { level: '极佳', color: '#F59E0B', icon: 'star', desc: '远山天际线一览无余，风光长焦绝佳时机', pct: 100 };
    if (km >= 10) return { level: '良好', color: '#10B981', icon: 'check-circle', desc: '城市天际线清晰可见，适合各类风光拍摄', pct: 75 };
    if (km >= 5)  return { level: '一般', color: '#F59E0B', icon: 'minus-circle', desc: '远景略显朦胧，建议中近景构图', pct: 50 };
    if (km >= 1)  return { level: '较差', color: '#F97316', icon: 'exclamation-circle', desc: '能见度偏低，适合氛围感/雾感创作', pct: 25 };
    return { level: '极差', color: '#EF4444', icon: 'times-circle', desc: '浓雾或严重污染，建议室内或微距拍摄', pct: 5 };
  },

  // 朝霞/晚霞概率计算
  // 核心原理：云量30-70%是火烧云最佳条件，再综合湿度判断
  getGlowProbability(hourlyData, isSunrise, weatherNow) {
    // 扩大目标时段范围（日出前后/日落前后各3小时）
    const targetHours = isSunrise ? [4, 5, 6, 7, 8] : [15, 16, 17, 18, 19];
    let cloudSum = 0, humiditySum = 0, count = 0;
    for (const h of hourlyData) {
      const hour = new Date(h.fxTime).getHours();
      if (targetHours.includes(hour)) {
        cloudSum += parseInt(h.cloud) || 0;
        humiditySum += parseInt(h.humidity) || 0;
        count++;
      }
    }
    // 回退：如果逐小时数据覆盖不到目标时段（如晚上查晚霞），用当前天气数据
    if (count === 0 && weatherNow) {
      const cloud = parseInt(weatherNow.cloud) || 50;
      const humidity = parseInt(weatherNow.humidity) || 50;
      cloudSum = cloud; humiditySum = humidity; count = 1;
    }
    if (count === 0) return 0;
    const avgCloud = cloudSum / count;
    const avgHumidity = humiditySum / count;
    // 云量评分：30-70%最佳（有云才能烧，但不能全阴）
    let cloudScore = 0;
    if (avgCloud >= 30 && avgCloud <= 70) cloudScore = 1;
    else if (avgCloud >= 10 && avgCloud <= 90) cloudScore = 0.6;
    else cloudScore = 0.2;
    // 湿度评分：40-70%最佳（太干无霞光，太湿有雾）
    let humidityScore = 0;
    if (avgHumidity >= 40 && avgHumidity <= 70) humidityScore = 1;
    else if (avgHumidity >= 20 && avgHumidity <= 90) humidityScore = 0.6;
    else humidityScore = 0.3;
    return Math.round((cloudScore * 0.6 + humidityScore * 0.4) * 100);
  }
};

// ===========================
// 推荐引擎
// ===========================
const RecommendEngine = {
  themes: [
    { id: 'sunset-city', name: '城市日落风光', weight: 5, icon: 'sun-o',
      score: ctx => ctx.sunsetGlow * 0.5 + ctx.visibilityScore * 0.3 + (ctx.isClear ? 20 : 0) },
    { id: 'blue-hour-city', name: '蓝调城市夜景', weight: 4, icon: 'moon-o',
      score: ctx => (ctx.cloudCover < 30 ? 40 : 10) + (ctx.windSpeed < 15 ? 30 : 10) + (ctx.isClear ? 20 : 0) },
    { id: 'morning-fog', name: '晨雾风光', weight: 4, icon: 'cloud',
      score: ctx => (ctx.visibilityKm >= 1 && ctx.visibilityKm <= 5 ? 50 : 10) + (ctx.humidity > 70 ? 30 : 10) + (ctx.isMorning ? 20 : 0) },
    { id: 'rain-fresh', name: '雨后清新街拍', weight: 3, icon: 'tint',
      score: ctx => (ctx.rainRecent ? 50 : 0) + (ctx.visibilityKm > 5 ? 30 : 10) },
    { id: 'arch-shadow', name: '建筑几何光影', weight: 3, icon: 'building-o',
      score: ctx => (ctx.isClear ? 50 : 10) + (ctx.isGoldenHour ? 30 : 0) },
    { id: 'portrait-soft', name: '人像柔光', weight: 3, icon: 'user-o',
      score: ctx => (ctx.cloudCover > 40 && ctx.cloudCover < 80 ? 40 : 20) + (ctx.windSpeed < 10 ? 30 : 10) },
    { id: 'macro-eco', name: '微距生态', weight: 3, icon: 'leaf',
      score: ctx => (ctx.humidity > 60 ? 40 : 15) + (ctx.windSpeed < 10 ? 30 : 10) + (ctx.rainRecent ? 20 : 0) },
    { id: 'bw-doc', name: '黑白纪实', weight: 2, icon: 'adjust',
      score: ctx => (ctx.isOvercast ? 45 : 15) + (ctx.visibilityKm > 3 ? 20 : 5) }
  ],

  getRecommendations(context) {
    const scored = this.themes.map(t => ({
      ...t,
      points: t.score(context) * (t.weight / 5)
    }));
    scored.sort((a, b) => b.points - a.points);
    return scored.slice(0, 3);
  }
};

// ===========================
// UI 渲染函数
// ===========================
function getWeatherEmoji(code) {
  const map = {
    '100': '☀️','101': '🌤️','102': '⛅','103': '☁️','104': '☁️',
    '300': '🌧️','301': '🌧️','302': '⛈️','304': '🌨️','305': '🌦️',
    '306': '🌧️','307': '🌧️','400': '❄️','401': '❄️','402': '🌨️',
    '500': '🌫️','501': '🌫️','502': '🌫️'
  };
  return map[code] || '🌤️';
}

function getWeatherBg(iconCode) {
  const gradients = {
    '100': 'bg-gradient-to-br from-amber-200 via-amber-100 to-amber-50',
    '101': 'bg-gradient-to-br from-amber-200 via-amber-100 to-amber-50',
    '102': 'bg-gradient-to-br from-slate-200 via-amber-100 to-amber-50',
    '103': 'bg-gradient-to-br from-slate-300 via-slate-100 to-slate-50',
    '104': 'bg-gradient-to-br from-slate-300 via-slate-100 to-slate-50',
    '300': 'bg-gradient-to-br from-slate-400 via-blue-200 to-slate-100',
    '301': 'bg-gradient-to-br from-slate-400 via-blue-200 to-slate-100',
    '302': 'bg-gradient-to-br from-slate-500 via-blue-300 to-slate-200',
    '400': 'bg-gradient-to-br from-slate-400 via-blue-100 to-white',
    '500': 'bg-gradient-to-br from-slate-300 via-amber-100 to-slate-100',
  };
  return gradients[iconCode] || gradients['100'];
}

function renderWeatherCard(data) {
  const card = document.getElementById('card-weather');
  const iconCode = data.icon || '100';
  card.className = `photographer-card card-golden ${getWeatherBg(iconCode)} card-enter`;
  card.innerHTML = `
    <div class="text-center py-4">
      <div class="text-6xl mb-1">${getWeatherEmoji(iconCode)}</div>
      <div class="text-5xl font-bold text-gray-800 mb-1">${data.temp}°</div>

function renderLightCard(sunData) {
  const card = document.getElementById('card-light');
  const sunrise = sunData.sunrise, sunset = sunData.sunset;
  if (!sunrise || !sunset) {
    card.innerHTML = `<div class="text-center text-gray-400 py-8">日出日落数据暂不可用</div>`;
    return;
  }
  const golden = CalcEngine.getGoldenHour(sunrise, sunset);
  const blue = CalcEngine.getBlueHour(sunrise, sunset);
  const countdown = CalcEngine.getCountdown(sunrise, sunset);
  const fmt = iso => {
    const d = new Date(iso);
    return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  };
  const h = Math.floor(countdown.ms / 3600000);
  const m = Math.floor((countdown.ms % 3600000) / 60000);

  card.className = 'photographer-card card-blue card-enter';
  card.innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <i class="fa fa-clock-o text-blue-hour text-xl"></i>
      <span class="font-bold text-gray-700 text-lg">光影时间</span>
    </div>
    <div class="relative py-3 mb-4">
      <div class="flex justify-between text-xs text-gray-500 mb-2">
        <span>${fmt(sunrise)} 日出</span>
        <span>日落 ${fmt(sunset)}</span>
      </div>
      <div class="h-3 rounded-full overflow-hidden" style="background:linear-gradient(to right, #6366F1 0%, #6366F1 15%, #F59E0B 25%, #FDE68A 40%, #FDE68A 60%, #F59E0B 75%, #6366F1 85%, #6366F1 100%)"></div>
      <div class="flex justify-between text-xs text-gray-400 mt-1">
        <span>蓝→金→</span><span>→金→蓝</span>
      </div>
    </div>
    <div class="space-y-1.5 text-sm">
      <div class="flex justify-between"><span class="text-amber-500">🌅 清晨黄金</span><span>${fmt(golden.morning.start)} - ${fmt(golden.morning.end)}</span></div>
      <div class="flex justify-between"><span class="text-blue-500">🌙 清晨蓝调</span><span>${fmt(blue.morning.start)} - ${fmt(blue.morning.end)}</span></div>
      <div class="border-t my-1.5"></div>
      <div class="flex justify-between"><span class="text-amber-500">🌇 傍晚黄金</span><span>${fmt(golden.evening.start)} - ${fmt(golden.evening.end)}</span></div>
      <div class="flex justify-between"><span class="text-blue-500">🌙 傍晚蓝调</span><span>${fmt(blue.evening.start)} - ${fmt(blue.evening.end)}</span></div>
    </div>
    <div class="mt-4 pt-3 border-t border-gray-100 text-center">
      <span class="text-blue-hour font-bold">⏱ 距离${countdown.target}还有 ${h}h ${m}min</span>
    </div>
  `;
}

function renderVisibilityCard(km) {
  const card = document.getElementById('card-visibility');
  const r = CalcEngine.getVisibilityRating(km);
  card.className = 'photographer-card card-purple card-enter';
  card.innerHTML = `
    <div class="flex items-center gap-2 mb-3">
      <i class="fa fa-eye text-purple-500 text-xl"></i>
      <span class="font-bold text-gray-700 text-lg">能见度</span>
    </div>
    <div class="flex items-end gap-2 mb-3">
      <span class="text-5xl font-bold" style="color:${r.color}">${km}</span>
      <span class="text-gray-500 text-lg mb-1">公里</span>
      <span class="ml-auto px-3 py-1 rounded-full text-sm font-bold text-white" style="background:${r.color}">${r.level}</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-3">
      <div class="h-2.5 rounded-full transition-all duration-700" style="width:${r.pct}%;background:${r.color}"></div>
    </div>
    <div class="flex justify-between text-xs text-gray-400 mb-3"><span>0</span><span>5</span><span>10</span><span>15</span><span>20km</span></div>
    <div class="bg-gray-50 rounded-xl p-3 text-sm text-gray-600"><i class="fa fa-lightbulb-o mr-1" style="color:${r.color}"></i>${r.desc}</div>
  `;
}

function renderGlowCard(sunriseProb, sunsetProb) {
  const card = document.getElementById('card-sunset-glow');
  card.className = 'photographer-card card-purple card-enter';
  const srLabel = sunriseProb >= 70 ? '很可能烧！' : sunriseProb >= 50 ? '有希望' : sunriseProb >= 30 ? '概率较低' : '不太可能';
  const ssLabel = sunsetProb >= 70 ? '很可能烧！' : sunsetProb >= 50 ? '有希望' : sunsetProb >= 30 ? '概率较低' : '不太可能';
  const higher = sunsetProb >= sunriseProb ? 'sunset' : 'sunrise';
  const max = Math.max(sunriseProb, sunsetProb);
  const advice = max >= 70 ? '💡 高概率霞光！建议提前 1 小时到达机位'
    : max >= 50 ? '💡 有一定概率出霞，值得关注天气变化'
    : max >= 30 ? '💡 霞光条件一般，可考虑其他拍摄主题'
    : '💡 今日霞光条件不佳，建议关注其他时段';

  card.innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <i class="fa fa-fire text-purple-500 text-xl"></i>
      <span class="font-bold text-gray-700 text-lg">朝霞 / 晚霞</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="text-center p-4 rounded-xl ${higher==='sunrise'?'bg-amber-50 ring-2 ring-amber-300':'bg-gray-50'}">
        <div class="text-3xl mb-1">🌄</div>
        <div class="text-3xl font-bold ${higher==='sunrise'?'text-golden':'text-gray-400'}">${sunriseProb}%</div>
        <div class="text-xs text-gray-500 mt-1">明早晨霞</div>
        <div class="text-xs font-medium ${higher==='sunrise'?'text-golden':'text-gray-400'} mt-1">${srLabel}</div>
      </div>
      <div class="text-center p-4 rounded-xl ${higher==='sunset'?'bg-amber-50 ring-2 ring-amber-300':'bg-gray-50'}">
        <div class="text-3xl mb-1">🌇</div>
        <div class="text-3xl font-bold ${higher==='sunset'?'text-golden':'text-gray-400'}">${sunsetProb}%</div>
        <div class="text-xs text-gray-500 mt-1">今晚晚霞</div>
        <div class="text-xs font-medium ${higher==='sunset'?'text-golden':'text-gray-400'} mt-1">${ssLabel}</div>
      </div>
    </div>
    <div class="mt-4 pt-3 border-t border-gray-100 text-sm text-gray-600 text-center">${advice}</div>
  `;
}

function renderRecommendCard(recommendations) {
  const card = document.getElementById('card-recommend');
  card.className = 'photographer-card card-green card-enter';
  const best = recommendations[0];
  const stars = '★'.repeat(Math.min(5, Math.round(best.points / 20))) + '☆'.repeat(Math.max(0, 5 - Math.round(best.points / 20)));

  card.innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <i class="fa fa-camera text-green-500 text-xl"></i>
      <span class="font-bold text-gray-700 text-lg">今日适合拍摄</span>
    </div>
    <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-5 text-center mb-3">
      <div class="text-4xl mb-2"><i class="fa fa-${best.icon} text-green-500"></i></div>
      <div class="text-xl font-bold text-gray-800 mb-1">${best.name}</div>
      <div class="text-golden text-lg mb-2">${stars}</div>
      <div class="text-sm text-gray-500">综合天气数据智能推荐</div>
    </div>
    ${recommendations.length > 1 ? `
    <div class="text-sm text-gray-500 mb-2">📋 次选方案</div>
    <div class="space-y-2">
      ${recommendations.slice(1).map(r => `
        <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
          <i class="fa fa-${r.icon} text-gray-400 text-lg"></i>
          <span class="flex-1 font-medium text-gray-600">${r.name}</span>
          <span class="text-xs text-gray-400">${Math.round(r.points)}分</span>
        </div>
      `).join('')}
    </div>` : ''}
  `;
}

function showSkeletons() {
  const heights = { 'card-weather':'h-48', 'card-light':'h-40', 'card-visibility':'h-36', 'card-sunset-glow':'h-36', 'card-recommend':'h-44' };
  Object.entries(heights).forEach(([id, h]) => {
    document.getElementById(id).innerHTML = `<div class="skeleton ${h} rounded-xl"></div>`;
  });
}

  bindEvents() {
    document.getElementById('city-trigger').addEventListener('click', () => this.openCitySheet());
    document.getElementById('refresh-btn').addEventListener('click', () => this.refresh());
    document.getElementById('btn-gps').addEventListener('click', () => this.useGPS());
    document.getElementById('city-search-input').addEventListener('input', e => this.handleSearch(e.target.value));
    document.getElementById('btn-gps').addEventListener('touchstart', function() { this.classList.add('bg-amber-200'); });
    document.getElementById('btn-gps').addEventListener('touchend', function() { this.classList.remove('bg-amber-200'); });
    document.getElementById('settings-btn').addEventListener('click', () => this.showSetupOverlay());
  },

  async loadCity(city) {
    this.currentCity = city;
    Cache.set('last_city', city, Infinity);
    Geo.addFavoriteCity(city);
    document.getElementById('city-name').textContent = city.name;
    await this.fetchAllData(city.id);
    this.closeCitySheet();
    this.renderFavorites();
  },

  async fetchAllData(locationId) {
    showSkeletons();
    this.hideStaleBanner();
    // 逐个请求，任一失败不阻塞其他
    const results = { weatherNow: null, weather24h: null, sunData: null, airNow: null };
    const errors = [];
    const tasks = [
      API.getWeatherNow(locationId).then(d => results.weatherNow = d).catch(e => errors.push('天气:'+e.message)),
      API.getWeather24h(locationId).then(d => results.weather24h = d).catch(e => errors.push('逐小时:'+e.message)),
      API.getSunTimes(locationId).then(d => results.sunData = d).catch(e => errors.push('日出日落:'+e.message)),
      API.getAirNow(locationId).then(d => results.airNow = d).catch(e => {}), // 空气质量可选
    ];
    await Promise.allSettled(tasks);
    // 至少要有天气数据才能渲染
    if (!results.weatherNow) {
      if (this.currentData) {
        this.updateUI(this.currentData.weatherNow, this.currentData.weather24h, this.currentData.sunData, this.currentData.airNow);
        this.showStaleBanner();
      } else {
        this.clearSkeletonsWithHint('数据加载失败：' + (errors.join('; ') || '网络异常'));
        if (errors.length) this.showError(errors[0]);
      }
      return;
    }
    this.currentData = results;
    this.updateUI(results.weatherNow, results.weather24h, results.sunData, results.airNow);
    if (errors.length) this.showError('部分数据加载失败：' + errors.join('; '));
  },

  updateUI(weatherNow, weather24h, sunData, airNow) {
    renderWeatherCard(weatherNow);

    const visRaw = parseFloat(weatherNow.vis);
    const visibilityKm = (!isNaN(visRaw) && visRaw > 0) ? visRaw
      : (airNow && airNow.pm2p5 ? Math.max(0.5, 30 - parseFloat(airNow.pm2p5) * 0.1) : 10);

    renderLightCard(sunData || {});
    renderVisibilityCard(Math.round(visibilityKm));

    const hourlyData = weather24h || [];
    const sunriseProb = CalcEngine.getGlowProbability(hourlyData, true, weatherNow);
    const sunsetProb = CalcEngine.getGlowProbability(hourlyData, false, weatherNow);
    renderGlowCard(sunriseProb, sunsetProb);

    const ctx = this.buildContext(weatherNow, visibilityKm, sunriseProb, sunsetProb, sunData);
    const recs = RecommendEngine.getRecommendations(ctx);
    renderRecommendCard(recs);

    document.getElementById('weather-update-time').textContent =
      `📍 ${this.currentCity.name} · 更新于 ${new Date().toLocaleTimeString('zh-CN')}`;
  },

  buildContext(weatherNow, visibilityKm, sunriseProb, sunsetProb, sunData) {
    const icon = weatherNow.icon || '100';
    const now = new Date();
    const hour = now.getHours();
    return {
      sunsetGlow: sunsetProb,
      sunriseGlow: sunriseProb,
      visibilityScore: Math.min(100, visibilityKm * 5),
      visibilityKm,
      isClear: icon === '100' || icon === '101',
      isOvercast: icon === '104',
      cloudCover: parseInt(weatherNow.cloud) || 50,
      windSpeed: parseInt(weatherNow.windSpeed) || 0,
      humidity: parseInt(weatherNow.humidity) || 50,
      isMorning: hour >= 5 && hour <= 9,
      isGoldenHour: false,
      rainRecent: (weatherNow.text || '').includes('雨')
    };
  },

  async handleSearch(query) {
    clearTimeout(this.searchTimer);
    if (query.length < 1) {
      document.getElementById('search-results').classList.add('hidden');
      return;
    }
    // 本地模糊匹配内置城市列表
    const q = query.trim();
    const matches = App._getCities().filter(c =>
      c.name.includes(q) || c.prov.includes(q)
    ).slice(0, 20);
    if (matches.length > 0) {
      this.renderSearchResults(matches.map(c => ({ id: c.id, name: c.name, adm1: c.prov })));
    } else {
      // 不在内置列表，尝试直接用城市名查天气
      document.getElementById('search-results').classList.remove('hidden');
      document.getElementById('search-results-list').innerHTML =
        '<div class="text-gray-400 text-sm p-3">未找到匹配城市，请尝试其他关键词</div>';
    }
  },

  renderSearchResults(cities) {
    const section = document.getElementById('search-results');
    const list = document.getElementById('search-results-list');
    if (!cities.length) {
      list.innerHTML = '<div class="text-gray-400 text-sm p-3">未找到匹配城市</div>';
    } else {
      list.innerHTML = cities.map(c => `
        <div class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer touch-target"
             onclick="App.loadCity({id:'${c.id}',name:'${c.name}',adm1:'${c.adm1||''}'})">
          <i class="fa fa-map-marker text-gray-400"></i>
          <span class="flex-1 font-medium text-gray-700">${c.name}</span>
          <span class="text-xs text-gray-400">${c.adm1||''} ${c.adm2||''}</span>
        </div>
      `).join('');
    }
    section.classList.remove('hidden');
  },

  renderFavorites() {
    const cities = Geo.getFavoriteCities();
    const list = document.getElementById('favorites-list');
    const section = document.getElementById('favorites-section');
    if (!cities.length) {
      section.classList.add('hidden');
      return;
    }
    section.classList.remove('hidden');
    list.innerHTML = cities.map(c => `
      <div class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer touch-target"
           onclick="App.loadCity({id:'${c.id}',name:'${c.name}',adm1:'${c.adm1||''}'})">
        <i class="fa fa-map-marker text-golden"></i>
        <span class="flex-1 font-medium text-gray-700">${c.name}</span>
        <span class="text-xs text-gray-400 mr-2">${c.adm1||''}</span>
        <button class="text-gray-300 hover:text-red-400 p-1 touch-target" onclick="event.stopPropagation();Geo.removeFavoriteCity('${c.id}')">
          <i class="fa fa-times"></i>
        </button>
      </div>
    `).join('');
  },

  openCitySheet() {
    document.getElementById('city-sheet').classList.add('open');
    document.getElementById('sheet-backdrop').classList.add('open');
    document.getElementById('city-search-input').value = '';
    document.getElementById('search-results').classList.add('hidden');
    this.renderFavorites();
  },

  closeCitySheet() {
    document.getElementById('city-sheet').classList.remove('open');
    document.getElementById('sheet-backdrop').classList.remove('open');
  },

  async useGPS() {
    const status = document.getElementById('gps-status');
    status.textContent = '定位中…';
    try {
      const pos = await Geo.getCurrentPosition();
      const city = await Geo.getCityByCoords(pos.lat, pos.lon);
      status.textContent = '';
      await this.loadCity(city);
    } catch (err) {
      status.textContent = '定位失败，请手动搜索';
      this.clearSkeletonsWithHint('无法自动定位，请点击上方城市栏搜索');
      setTimeout(() => { status.textContent = ''; }, 5000);
    }
  },

  clearSkeletonsWithHint(hint) {
    const cards = ['card-weather','card-light','card-visibility','card-sunset-glow','card-recommend'];
    cards.forEach((id, i) => {
      const card = document.getElementById(id);
      if (i === 0) {
        card.innerHTML = `<div class="text-center py-12 text-gray-400"><i class="fa fa-map-marker text-4xl mb-3 block"></i><p class="text-sm">${hint}</p><button class="mt-3 bg-golden text-white px-5 py-2 rounded-full text-sm font-bold" onclick="App.openCitySheet()">手动选择城市</button></div>`;
      } else {
        card.innerHTML = '';
      }
    });
  },

  async refresh() {
    if (this.currentCity) {
      const btn = document.getElementById('refresh-btn');
      btn.style.transform = 'rotate(360deg)';
      btn.style.transition = 'transform 0.6s ease';
      setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 600);
      await this.fetchAllData(this.currentCity.id);
    }
  },

  showStaleBanner() {
    const banner = document.getElementById('stale-banner');
    banner.classList.remove('hidden');
    banner.innerHTML = '<i class="fa fa-exclamation-triangle"></i> 无法连接网络，显示的是缓存数据';
    setTimeout(() => this.hideStaleBanner(), 5000);
  },

  hideStaleBanner() {
    document.getElementById('stale-banner').classList.add('hidden');
  },

  showError(msg) {
    const banner = document.getElementById('stale-banner');
    banner.classList.remove('hidden');
    banner.className = 'fixed top-0 inset-x-0 z-50 bg-red-100 text-red-800 text-xs text-center py-1.5';
    banner.innerHTML = `<i class="fa fa-exclamation-circle"></i> ${msg}`;
    setTimeout(() => { banner.classList.add('hidden'); banner.className = 'hidden fixed top-0 inset-x-0 z-50 bg-yellow-100 text-yellow-800 text-xs text-center py-1.5'; }, 4000);
  },

};

// 启动
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
